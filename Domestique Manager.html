function buildFieldMeta(){
  const meta = [];
  raceLineup().forEach(r => meta.push({id:r.id, name:r.name, emoji:r.emoji, role:r.role, team:'You', mine:true}));
  if(!G.rivalField || !G.rivalField.length) G.rivalField = buildRivalField();
  G.rivalField.forEach(r => meta.push({id:r.id, name:r.name, emoji:r.emoji, role:r.role,
    team:r.team, mine:false, stats:r.stats, age:r.age}));
  return meta;
}
const RIVAL_TEAM = {};   // filled as the field is built
function teamOfRider(id){
  const m = metaById(id);
  return m ? m.team : 'You';
}

function freshSeasonPoints(){
  const o = {}; TEAM_NAMES.forEach(t=>o[t]=0); return o;
}
function resetGtClassification(){
  if(!G.season || !Object.keys(G.season).length) G.season = freshSeasonPoints();
  G.gcTimes={}; G.sprintPts={}; G.komPts={};
  G.fieldMeta = buildFieldMeta();
  G.fieldMeta.forEach(m => { G.gcTimes[m.id]=0; G.sprintPts[m.id]=0; G.komPts[m.id]=0; });
}
resetGtClassification();

function metaById(id){ return G.fieldMeta.find(m=>m.id===id); }

/* ===================== RACE ENGINE ===================== */

function abilityFor(r, grad, type, xPct){
  const s = r.stats;
  // pavé rewards raw power and resistance rather than pure climbing or speed
  if(inCobbles(type, xPct)) return s.endurance*0.5 + s.sprint*0.28 + s.hill*0.22;
  if(xPct > 97.4 && type !== 'tt' && grad < 2) return s.sprint*0.82 + s.endurance*0.18; // the sprint
  if(grad > 4.2) return s.mountain;                                    // real climbing
  if(grad > 1.6) return s.hill;                                        // rolling / punchy
  if(grad < -3)  return s.tt*0.40 + s.sprint*0.25 + s.recovery*0.35;   // descending: nerve and handling
  if(type === 'tt') return s.tt;                                       // solo against the clock
  return (s.tt + s.endurance)/2;                                       // flat cruising
}

function buildRace(){
  const stage = currentStage();
  const type = stage.type;
  // riders who have abandoned or are injured out do not take the start
  const riders = G.fieldMeta.filter(m => {
    if(!m.mine) return true;
    const own = riderById(m.id);
    return own && riderAvailable(own);
  }).map(m => {
    const own = m.mine ? riderById(m.id) : null;
    const stats = own ? own.stats : m.stats;
    const condition = own ? own.condition : rand(78,100);
    return {
      id:m.id, name:m.name, emoji:m.emoji, role:m.role, team:m.team, mine:m.mine,
      stats:{...stats}, condition,
      energy: clamp(72 + condition*0.28, 0, 100),
      order:'follow', zone:'thr', effort: (type==='tt'?87:68),
      injPenalty: (own && own.injury && own.injury.type==='knock') ? (own.injury.penalty||0.9) : 1,
      dist:0, speed:0, groupIdx:0, groupName:'Peloton',
      cracked:false, finished:false, finishTime:null, plan:'peloton',
      attacking:false, attackUntil:0, inBreak:false, workingInBreak:false, justCaught:false,
    };
  });
  // Every rival team decides what it actually wants from THIS stage, and races
  // accordingly: a sprinter's team chases the break down, a GC team shelters its
  // leader and refuses to work, a team with nothing to defend goes up the road.
  const key = terrainStatKey(type);
  const teamGoals = {};
  ['Nordwind','Roccia','Horizon'].forEach(tm => {
    const squad = riders.filter(r=>!r.mine && r.team===tm);
    if(!squad.length) return;
    const leader = squad.slice().sort((a,b)=> b.stats[key]-a.stats[key])[0];
    const bestSprint = squad.slice().sort((a,b)=> b.stats.sprint-a.stats.sprint)[0];
    let goal;
    if(type === 'tt') goal = 'tt';
    else if((type==='flat'||type==='cobbles') && bestSprint.stats.sprint >= 7) goal = 'sprint';
    else if((type==='mountain'||type==='uphill'||type==='medium') && leader.stats[key] >= 7) goal = 'gc';
    else if(leader.stats[key] >= 8) goal = 'gc';
    else goal = 'break';
    teamGoals[tm] = goal;
    const boss = (goal === 'sprint') ? bestSprint : leader;
    boss.teamLeader = true;
    squad.forEach(r => { r.teamGoal = goal; r.isTeamBoss = (r.id === boss.id); });
  });

  // A handful of AI riders are given a breakaway plan (not on a time trial)
  if(type !== 'tt'){
    const cands = riders.filter(r=>!r.mine && !r.teamLeader && r.role!=='Sprinter' && r.role!=='GC Leader');
    cands.sort(()=>Math.random()-0.5);
    cands.slice(0, 3 + Math.floor(rand(0,2))).forEach(r => r.plan='break');
  }
  const pkey = stage.key;
  // conditions of the day: a tailwind makes for a fast, controlled race,
  // a headwind wears everyone down and makes escapes far harder
  const windRoll = rand(-1, 1);
  const wind = {
    v: windRoll,
    label: windRoll > 0.45 ? 'TAILWIND' : (windRoll < -0.45 ? 'HEADWIND' :
           (Math.abs(windRoll) < 0.15 ? 'STILL' : 'CROSSWIND')),
  };
  const estSeconds = (stage.dist/38)*3600;
  G.race = {
    type, pkey, distTotal: stage.dist, teamGoals, wind, t:0, riders,
    running:true, speedMult:1, dtSim: estSeconds/620,
    groups:[], events:[], tick:0,
    breakAnnounced:false, chaseAnnounced:false, finalKmAnnounced:false,
    firedEvents:{}, alert:null, showGC:false, autoSim:false, finishOrder:[],
    neutralUntil: (type==='tt' ? 0 : 3.2), flagDropped:false,
    breakEstablished:false, chaseIntent:1, breakWilling:0, waveCount:0,
    gcLeaderId:null, _teamSig:null,
    lastClimbEvent:-1, timer:null,
  };
  pushEvent('Neutral start \u2014 the bunch rolls out of ' + stage.name + '.');
}

function pushEvent(text){
  G.race.events.unshift({t:G.race.t, text});
  if(G.race.events.length > 26) G.race.events.pop();
}

function computeGroups(){
  const R = G.race;
  const active = R.riders.slice().sort((a,b)=> b.dist - a.dist);
  const groups = [];
  let cur = null;
  active.forEach(r => {
    if(!cur || (cur.leadDist - r.dist) > 0.22){
      cur = {members:[], leadDist:r.dist, sumSpeed:0};
      groups.push(cur);
    }
    cur.members.push(r);
    cur.leadDist = Math.max(cur.leadDist, r.dist);
    cur.sumSpeed += r.speed;
  });
  // label groups: biggest bunch is the peloton; ahead of it = breakaway/chase; behind = dropped
  let biggest = 0;
  groups.forEach((g,i)=>{ if(g.members.length > groups[biggest].members.length) biggest = i; });
  groups.forEach((g,i) => {
    g.avgDist = g.members.reduce((s,r)=>s+r.dist,0)/g.members.length;
    g.avgSpeed = Math.max(6, g.sumSpeed/g.members.length);
    if(i === biggest) g.name = 'Peloton';
    else if(i < biggest) g.name = (i===0 ? 'Breakaway' : 'Chase group');
    else g.name = (g.members.length > 3 ? 'Grupetto' : 'Dropped');
    g.cls = g.name==='Breakaway'?'break':(g.name==='Peloton'?'peloton':(i<biggest?'chase':'dropped'));
    g.members.forEach(r => { r.groupIdx = i; r.groupName = g.name; });
  });
  const lead = groups.length ? groups[0].leadDist : 0;
  groups.forEach(g => { g.gap = (lead - g.avgDist)/g.avgSpeed*3600; });
  return groups;
}

/* ------------------------------------------------------------------
   RACE DYNAMICS
   Attacks that mostly fail, a peloton that chases only when it suits
   somebody, breakaways that fall apart when nobody will work, and
   counter-attacks the moment a move is caught.
   ------------------------------------------------------------------ */
function dangerousInBreak(R, front){
  // a rider high on GC, or a strong finisher, makes a move worth chasing
  return front.members.some(m => m.teamLeader || m.role==='GC Leader' ||
    (G.gcTimes && gcLeader(R) && m.stats.mountain >= 8));
}

function updateRaceDynamics(){
  const R = G.race;
  if(R.type === 'tt') return;
  {
    const fr = R.groups[0];
    const pc = fr ? fr.leadDist/R.distTotal*100 : 0;
    if(!R.flagDropped && pc >= R.neutralUntil){
      R.flagDropped = true;
      pushEvent('\u{1F6A9} The flag drops \u2014 the racing starts here.');
    }
    if(!R.flagDropped) return;      // nothing happens during the neutral zone
  }
  const front = R.groups[0];
  const pel   = R.groups.find(g=>g.name==='Peloton');
  if(!front) return;
  const pct = front.leadDist/R.distTotal*100;
  const isBreak = front !== pel && !!pel;
  const gap = isBreak ? pel.gap : 0;

  // attacks expire on their own; most of them achieve nothing
  R.riders.forEach(r=>{
    if(r.attacking && (pct > r.attackUntil || r.energy < 18)){
      r.attacking = false;
      r.justCaught = true;
    }
  });

  // ---- waves of early attacks until something sticks ----
  if(!R.breakEstablished && pct < 30 && (R.t - (R.lastWaveT||-99999)) > 380){
    R.lastWaveT = R.t;
    const cands = R.riders.filter(r => !r.mine && !r.finished && !r.attacking &&
      !r.teamLeader && r.energy > 58 && r.role !== 'Sprinter');
    cands.sort(()=>Math.random()-0.5);
    const n = 1 + Math.floor(Math.random()*4);
    cands.slice(0, n).forEach(r=>{ r.attacking = true; r.attackUntil = pct + rand(5,12); });
    R.waveCount = (R.waveCount||0) + 1;
  }

  // ---- has a move actually gone clear? ----
  if(!R.breakEstablished && isBreak && gap > 45 && front.members.length <= 9){
    R.breakEstablished = true;
    front.members.forEach(m=>{ m.inBreak = true; m.attacking = false; });
  }
  // ---- and has it been swallowed up? ----
  if(R.breakEstablished && (!isBreak || gap < 8)){
    R.breakEstablished = false;
    R.riders.forEach(m=>{ m.inBreak = false; });
    if(pct < 94 && (R.t - (R.lastWaveT||0)) > 200){
      R.lastWaveT = R.t;
      pushEvent('The move is caught \u2014 and the counter-attacks go straight away.');
      const cands = R.riders.filter(r => !r.mine && !r.finished && r.energy > 45 && !r.teamLeader);
      cands.sort(()=>Math.random()-0.5);
      cands.slice(0, 1 + Math.floor(Math.random()*3)).forEach(r=>{
        r.attacking = true; r.attackUntil = pct + rand(4,9);
      });
    }
  }

  // ---- who actually wants this break brought back? ----
  let intent = 0;
  Object.keys(R.teamGoals||{}).forEach(tm=>{
    const repped = isBreak && front.members.some(m=>m.team===tm);
    if(repped) return;                       // a man up the road: they will not work
    const goal = R.teamGoals[tm];
    if(goal === 'sprint') intent += 1.25;    // they need a bunch sprint
    else if(goal === 'gc') intent += dangerousInBreak(R, front) ? 1.0 : 0.25;
    else intent += 0.2;                      // free-riding
  });
  // Nobody chases in the opening hour; commitment builds as the finish nears
  // and as the gap grows past what the sprinters' teams can accept.
  const sprintDay = (R.type === 'flat' || R.type === 'cobbles');
  if(pct < 28)      intent *= sprintDay ? 0.7 : 0.35;   // sprinters' teams never fully let go
  else if(pct < 62) intent *= 0.8;
  intent += clamp((gap - 130)/150, 0, 1.6);          // a big lead forces teams to commit
  if(pct > 85) intent = Math.max(intent, 1.7);       // somebody always rides in the finale
  // on a sprinters' day the fast men's teams commit fully in the closing hour
  if((R.type === 'flat' || R.type === 'cobbles') && pct > 58) intent = Math.max(intent, 2.3);
  if((R.type === 'flat' || R.type === 'cobbles') && pct > 80) intent = Math.max(intent, 3.0);
  R.chaseIntent = clamp(intent, 0, 3.4);

  // ---- cooperation inside the break ----
  if(R.breakEstablished && isBreak){
    let willing = 0;
    front.members.forEach(m=>{
      if(m.mine) { if(m.order === 'pull') willing++; return; }
      // they stop working when they are tired, or when the finish is close enough to race for
      const coop = m.energy > 38 && pct < 93;
      m.workingInBreak = coop;
      if(coop) willing++;
    });
    R.breakWilling = willing;
  } else {
    R.breakWilling = 0;
  }

  // ---- late tactical games in a small front group ----
  if(pct > 74 && front.members.length <= 8 && (R.t - (R.lastLateT||-99999)) > 260){
    const sprinterPresent = front.members.some(m=>m.stats.sprint >= 8);
    const cands = front.members.filter(m => !m.mine && !m.finished && m.energy > 30 &&
      (sprinterPresent ? m.stats.sprint < 7 : true));
    if(cands.length){
      R.lastLateT = R.t;
      const a = cands[Math.floor(Math.random()*cands.length)];
      a.attacking = true; a.attackUntil = 101;
      pushEvent(a.name + ' attacks from the front group!');
    }
  }
}

/* AI decides how hard each non-player rider is riding */
function aiEffort(r, xPct, grad, R){
  const breakGap = (R.groups[0] && R.groups[0].name==='Breakaway')
    ? (R.groups.find(g=>g.name==='Peloton')||{gap:0}).gap : 0;
  let e;
  if(R.type === 'tt'){
    // solo against the clock: ride near threshold the whole way, empty it at the end
    e = 88;
    if(xPct > 85) e = 95;
    if(xPct > 95) e = 100;
    if(r.energy < 25) e = 78;
  } else if(r.attacking){
    // a rider actually going for it: full gas until it sticks or he cracks
    e = 100;
  } else if(r.inBreak && xPct < 96){
    // out front. He only works if he is willing to, and a break where nobody
    // will pull simply slows down and gets swallowed.
    if(r.workingInBreak) e = r.energy > 55 ? 88 : 82;
    else e = 66;
  } else if(r.plan === 'break' && xPct < 26 && !R.breakEstablished){
    e = 90;
  } else {
    // the bunch lets the move go early, then organises the chase
    // The bunch only rides as hard as somebody needs it to. With nobody
    // interested it drifts; with two sprinters' teams committed it flies.
    const intent = (R.chaseIntent != null) ? R.chaseIntent : 1;
    const drive = clamp(intent, 0, 3.4);
    e = 64 + drive*2;                       // the bunch always rolls along
    if(xPct > 45) e = 66 + drive*4;
    if(xPct > 68) e = 72 + drive*6;
    if(xPct > 82) e = 76 + drive*6;
    if(xPct > 93) e = 90;
    // a rider who has been up the road all day is running on empty by now
    if(r.plan === 'break') e = Math.min(e, r.energy > 35 ? 92 : 74);
    if(breakGap > 60 && xPct > 62) e += 6;
    if(breakGap < 20 && xPct > 62) e -= 8;
    if(grad > 4.2 && xPct > 55){
      if((r.role==='Climber' || r.role==='GC Leader') && r.energy > 32) e = 94;
      else if(r.role==='Sprinter') e = 62;
      else e = 76;
    }
    if((R.type==='mountain'||R.type==='medium'||R.type==='uphill') && xPct > 72 && grad > 2.5){
      // the decisive climbs: the best climbers commit and the bunch shatters
      if((r.role==='Climber'||r.role==='GC Leader'||r.role==='Puncheur') && r.energy > 26) e = Math.max(e, 94);
      else if(r.role==='Sprinter') e = Math.min(e, 70);
      else e = Math.max(e, 82);
      // and on the final ascent the pure climbers attack for real
      if(xPct > 84 && grad > 3.5 && r.energy > 28 &&
         (r.role==='Climber' || r.role==='GC Leader' || r.teamLeader)) e = 100;
    }
    if(inCobbles(R.type, xPct)){
      e = (r.role==='Sprinter' || r.role==='Climber') ? 80 : 90;
    }
    if(R.type === 'uphill' && xPct > 87){
      // the final ramp: climbers and puncheurs go, sprinters are dropped
      e = (r.role==='Climber'||r.role==='Puncheur'||r.role==='GC Leader') ? 97
        : (r.role==='Sprinter' ? 66 : 88);
    }
    if(xPct > 98.4 && R.type !== 'uphill'){
      e = (r.role==='Sprinter') ? 100 : 94;
    }
  }
  // ---- neutral start: the bunch rolls out together behind the car ----
  if(R.neutralUntil && xPct < R.neutralUntil) return 50;

  // ---- race to the team's objective for the day ----
  if(R.type !== 'tt' && r.teamGoal){
    if(r.teamGoal === 'sprint'){
      // their sprinter is kept fresh; the rest of the squad chases the break down
      if(r.isTeamBoss){ if(xPct < 96) e = Math.min(e, 58); else e = 100; }
      else if(xPct > 55) e = Math.max(e, breakGap > 40 ? 92 : 84);
    } else if(r.teamGoal === 'gc'){
      // they defend their leader and refuse to do the chasing on the flat
      if(r.isTeamBoss){ if(xPct < 84) e = Math.min(e, 60); }
      else if(grad > 3 && xPct > 60) e = Math.max(e, 88);
      else if(xPct < 90) e = Math.min(e, 66);
    } else if(r.teamGoal === 'break'){
      // nothing to defend: they want a man up the road and will not chase
      if(r.plan === 'break') e = Math.max(e, 86);
      else if(xPct < 92) e = Math.min(e, 68);
    }
  }

  // a protected leader hides in the bunch and saves it for the decisive moment
  if(r.teamLeader && R.type !== 'tt'){
    if(xPct < 86) e = Math.min(e, 56);
    else if(xPct < 95) e = Math.max(e, 92);
    else e = 100;
  }
  if(r.justCaught){ e = Math.min(e, 60); if(Math.random() < 0.02) r.justCaught = false; }
  if(r.energy < 14) e = Math.min(e, 52);
  if(r.energy < 5) e = 40;
  return clamp(e, 35, 100);
}

function multOf(effort){ return 0.70 + 0.42*(effort/100); }
function effortFromMult(m){ return clamp(((m - 0.70)/0.42)*100, 25, 140); }

/* How sheltered a rider is, by what you've told them to do.
   Sitting in the bunch is cheap; going to the front to pull is not;
   attacking means taking the wind entirely on your own. */
function shelterFor(effort){
  if(effort >= 100) return 1.00;   // attacking, full in the wind
  if(effort >= 85)  return 0.97;   // on the front, taking the wind
  if(effort >= 56)  return 0.66;   // in the wheels
  return 0.52;                     // hidden at the very back
}
/* Shelter is worth far less in a small group. Four men up the road have to
   rotate constantly; a 60-rider bunch hides you completely. This is what
   makes a breakaway so expensive. */
function groupShelterScale(size){
  if(size >= 16) return 1.0;
  if(size <= 2)  return 0.30;
  return 0.30 + 0.70*((size-2)/14);
}

/* A rider's own capability at a given effort, ignoring the group. */
function soloSpeed(r, effort, grad, type, xPct){
  const ability = abilityFor(r, grad, type, xPct);
  const flatPace = (35 + ability*0.85) * (1 + ((G.race && G.race.wind) ? G.race.wind.v*0.022 : 0));
  // uphill the road bites hard; downhill gravity takes over and keeps giving
  const climbPenalty = 1 + Math.max(0, grad)*0.165;
  const descentBoost = 1 + Math.min(12, Math.max(0, -grad))*0.075;
  const base = flatPace / climbPenalty * descentBoost;
  let mult = multOf(effort);
  // on a descent your effort matters much less than the gradient does
  if(grad < -2) mult = 1 + (mult - 1)*0.45;
  mult *= conditionFactor(r.condition);
  // a fast man can always find ten seconds of power, however hard the day was
  const sprinting = (type !== 'tt' && xPct > 98.5 && grad < 2);
  if(r.energy < 22 && !(sprinting && r.energy > 4)) mult *= (0.94 + 0.06*(r.energy/22));
  if(xPct > 96 && type !== 'tt' && grad < 2 && r.energy > 8){
    mult *= 1 + (r.stats.sprint - 5)*0.022;
  }
  if(r.mine) mult *= (1 + G.staff.equipment*0.004);
  if(r.injPenalty && r.injPenalty < 1) mult *= r.injPenalty;   // racing hurt
  return {speed: clamp(base*mult, 5, 88), base: Math.max(1, base)};
}

function raceTick(){
  const R = G.race;
  if(!R.running) return;
  // the closing kilometres play out in finer detail — the race slows down for the finale
  const leadKmToGo = R.groups[0] ? (R.distTotal - R.groups[0].leadDist) : R.distTotal;
  let finaleFactor = 1;
  if(leadKmToGo <= 3) finaleFactor = 0.28;
  else if(leadKmToGo <= 8) finaleFactor = 0.42;
  else if(leadKmToGo <= 15) finaleFactor = 0.6;
  const dt = R.dtSim * R.speedMult * finaleFactor;
  R.t += dt;
  R.tick++;

  R.groups = computeGroups();
  if(R.tick % 6 === 0) updateRaceDynamics();

  // 1) work out each group's pace — set by whoever is driving it on the front
  R.groups.forEach(g => {
    const cands = g.members.filter(r => !r.finished);
    if(!cands.length){ g.pace = 0; return; }
    const sample = cands.map(r => {
      const xPct = clamp(r.dist/R.distTotal*100, 0, 100);
      const grad = gradientAt(R.pkey, xPct, R.distTotal);
      if(!r.mine) r.effort = aiEffort(r, xPct, grad, R);
      const paceEffort = (r.cracked ? Math.min(r.effort,62) : r.effort);
      const s = soloSpeed(r, paceEffort, grad, R.type, xPct);
      r._solo = s; r._grad = grad; r._xPct = xPct;
      return {r, sp:s.speed};
    });
    // riders attacking at MAX ride their own race — they don't tow the bunch along
    const drivers = sample.filter(o => {
      if(o.r.mine) return o.r.order === 'pull';
      return o.r.effort >= 70 && o.r.effort < 100;
    });
    let cap;
    if(drivers.length){
      // Men rotating on the front take short turns and sit in between them, so a
      // group sustains a pace no single rider could hold on his own. This is what
      // lets a peloton reel in a lone escapee.
      const rot = Math.min(10, (drivers.length-1)*1.8);
      const boosted = drivers.map(o=>{
        const xp = clamp(o.r.dist/R.distTotal*100,0,100);
        const gr = gradientAt(R.pkey, xp, R.distTotal);
        return soloSpeed(o.r, Math.min(99, o.r.effort + rot), gr, R.type, xp).speed;
      });
      g.pace = boosted.reduce((a,v)=>a+v,0)/boosted.length;
      cap = Math.max.apply(null, boosted) * 1.02;
    } else {
      const src = sample.map(o=>o.sp).sort((a,b)=>a-b);
      g.pace = src[Math.floor(src.length*0.6)] || src[src.length-1];
      cap = Math.max.apply(null, sample.map(o=>o.sp));
    }
    if(R.type !== 'tt') g.pace *= 1 + clamp((cands.length-5)*0.0045, 0, 0.055);
    g.pace = Math.min(g.pace, cap);
    g._maxSolo = cap;
    const fronts = sample.filter(o=>o.r.effort < 100).map(o=>o.r.dist);
    g.bunchFront = fronts.length ? Math.max.apply(null, fronts) : g.leadDist;
    g.nDrivers = drivers.length;
    g._rawPace = g.pace;
  });

  // 1b) the bunch regulates the gap: the bigger the lead the harder teams chase,
  // and they ease off once the escape is back within reach
  if(R.type !== 'tt' && R.groups.length > 1){
    const leadDist = R.groups[0].leadDist;
    const urgency = ((R.groups[0].leadDist/R.distTotal*100) > 45) ? 1 : 0.25;
    R.groups.forEach((g,i) => {
      if(i === 0) return;
      const gapSec = (leadDist - g.avgDist)/Math.max(6, g.pace)*3600;
      if(g.name === 'Peloton' || g.cls === 'chase'){
        const climbing = (R.type==='mountain'||R.type==='medium'||R.type==='uphill');
        const commit = clamp((R.chaseIntent||1)/2.6, 0.35, 1.25);
        // on a sprinters' day the bunch simply will not let a move go beyond
        // what it can pull back, and rides accordingly
        const sprintDay = (R.type === 'flat' || R.type === 'cobbles');
        const ceiling = climbing ? 0.11 : (sprintDay && gapSec > 200 ? 0.20 : 0.135);
        g.pace *= 1 + clamp(gapSec/520, 0, ceiling)*urgency*commit;
        if(g._maxSolo) g.pace = Math.min(g.pace, g._maxSolo);
      }
    });
  }

  // 1c) standing orders from key-moment decisions
  R.riders.forEach(r => {
    if(!r.mine || r.finished) return;
    const xp = clamp(r.dist/R.distTotal*100,0,100);
    if(r.autoEaseAt != null && xp >= r.autoEaseAt){ setEff(r,2); r.autoEaseAt = null; }
    if(r.autoMaxAt  != null && xp >= r.autoMaxAt ){ setEff(r,4); r.autoMaxAt  = null; }
    if(R.type === 'tt' && r.zone) r.effort = TT_BY_KEY[r.zone].effort;
  });

  // 1d) LEAD-OUT & PROTECTION
  //  - your GC leader is sheltered by every teammate in his group
  //  - otherwise a rider is sheltered by the teammates you have placed AHEAD of
  //    him in the running order, which is what a lead-out train actually is
  R.riders.forEach(r => { r._mates = 0; });
  if(R.type !== 'tt'){
    const boss = gcLeader(R);
    if(boss && !boss.finished){
      const g = R.groups[boss.groupIdx];
      if(g){
        boss._mates = g.members.filter(m =>
          m.mine && m.id !== boss.id && !m.finished &&
          m.order !== 'relax' && m.order !== 'attack').length;
      }
    }
  }

  // 2) move every rider
  R.riders.forEach(r => {
    if(r.finished) return;
    const xPct = r._xPct != null ? r._xPct : clamp(r.dist/R.distTotal*100,0,100);
    const grad = r._grad != null ? r._grad : gradientAt(R.pkey, xPct, R.distTotal);
    const g = R.groups[r.groupIdx];
    const gSize = g ? g.members.length : 1;
    const solo = r._solo || soloSpeed(r, r.effort, grad, R.type, xPct);
    const inBunch = R.type !== 'tt' && gSize >= 3;

    let speed, shelter;
    const ord = r.mine ? r.order : null;
    if(!inBunch){
      speed = solo.speed;
      shelter = 1.0;
    } else if(R.neutralUntil && xPct < R.neutralUntil && g){
      speed = g.pace;                  // nobody races before the flag drops
      shelter = shelterFor(55);
    } else if(ord === 'attack'){
      speed = solo.speed;
      shelter = 1.0;
    } else if(ord === 'pull'){
      speed = Math.max(solo.speed, g.pace);
      shelter = 0.95;
    } else if(r.effort >= 100){
      // attacking: you go at your own speed and take the wind yourself.
      // if you're stronger than the bunch you go clear; if not, you drift back.
      speed = solo.speed;
      shelter = 1.0;
    } else if(r.effort >= 85){
      // on the front, driving the group along
      speed = Math.max(solo.speed, g.pace);
      shelter = shelterFor(r.effort);
    } else {
      // sitting in — you travel at the bunch's speed, if you can hold the wheel
      // a rider told to sit at the back fights less hard to hold the wheel
      const hold = (ord === 'relax') ? 0.97 : 1.04;
      const ceiling = soloSpeed(r, 100, grad, R.type, xPct).speed * 1.06;
      if(g.pace <= ceiling*hold){
        speed = g.pace;
        shelter = shelterFor(r.effort);
      } else {
        // pace is too high — dropped, riding at your own limit
        speed = soloSpeed(r, Math.min(100, r.effort+15), grad, R.type, xPct).speed;
        shelter = 0.92;
      }
    }

    // teammates riding ahead of him take the wind for him
    if(r._mates && ord !== 'attack') shelter *= Math.max(0.5, 1 - r._mates*0.13);
    // a small escape group shelters its riders far less than a full peloton
    if(inBunch) shelter = 1 - (1 - shelter)*groupShelterScale(gSize);

    // Drafting is an aerodynamic effect: at 20 km/h up a mountain it is worth
    // very little, so nobody can hide from a hard climb the way they can on the flat.
    if(grad > 1) shelter = shelter + (1 - shelter)*clamp((grad-1)/6, 0, 0.9);

    // 3) energy: charged for the pace actually ridden, discounted by shelter
    const loadEffort = effortFromMult(speed / solo.base);
    let drainPerKm = 0.33 * Math.pow(Math.max(loadEffort,25)/70, 2.8);
    if(R.neutralUntil && xPct < R.neutralUntil) drainPerKm *= 0.35;   // neutralised
    drainPerKm *= (1 - (r.stats.endurance - 5)*0.046);
    drainPerKm *= (1 + Math.max(0, grad)*0.10);
    if(grad < -2) drainPerKm *= clamp(1 + grad*0.075, 0.45, 1);   // recovering on the way down
    if(R.wind && R.wind.v < 0) drainPerKm *= (1 + Math.abs(R.wind.v)*0.10*shelter);
    if(inCobbles(R.type, xPct)) drainPerKm *= 1.6;   // pavé is brutally attritional
    if(r.injPenalty && r.injPenalty < 1) drainPerKm *= 1.18;
    drainPerKm *= shelter;
    const regenPerKm = (loadEffort <= 58) ? 0.10*(r.stats.recovery/6) : 0;

    // ---- THE SPRINT ----
    // Inside the final kilometre nobody is sitting in any more: every rider is
    // out of the saddle riding his own speed, so the fast men can actually come
    // past. The clamp below keeps it a bunch sprint rather than a solo escape.
    if(R.type !== 'tt' && xPct > 98.5 && r.energy > 3){
      const sprintEffort = Math.max(r.effort, 90);
      speed = soloSpeed(r, sprintEffort, grad, R.type, xPct).speed;
      shelter = 0.9;
    }

    if(R.type !== 'tt' && xPct > 98.4){
      const ref = (g && g.pace) ? g.pace : (R.groups[0] && R.groups[0].pace) || speed;
      if(ref) speed = clamp(speed, ref*0.93, ref*1.085);
    }

    r.speed = speed;
    const stepKm = speed*(dt/3600);
    r.dist += stepKm;

    // A bunch rides as one: riders sitting in stay compact with the group rather
    // than banking a permanent lead, so the finish is settled by the sprint itself.
    const attacking = (ord === 'attack') || (r.effort >= 100);
    if(inBunch && !attacking && g){
      const front = (g.bunchFront != null) ? g.bunchFront : g.leadDist;
      const behind = front - r.dist;
      if(behind > 0) r.dist += Math.min(behind*0.16, 0.06);
    }
    r.energy = clamp(r.energy - (drainPerKm - regenPerKm)*stepKm, 0, 100);

    if(r.energy <= 0.6 && !r.cracked){
      r.cracked = true;
      if(r.mine) pushEvent('\u26a0 ' + r.name + ' has blown up \u2014 nothing left in the tank.');
      else if(r.role==='GC Leader'||r.role==='Climber') pushEvent(r.name + ' cracks and slips backwards.');
    }
    if(r.cracked && r.energy > 16) r.cracked = false;

    if(r.dist >= R.distTotal){
      r.finished = true;
      r.finishTime = R.t - (r.dist - R.distTotal)/speed*3600;
      r.dist = R.distTotal;
      R.finishOrder = R.finishOrder || [];
      R.finishOrder.push({id:r.id, name:r.name, role:r.role, team:r.team, mine:r.mine, time:r.finishTime});
      if(R.finishOrder.length === 1){
        pushEvent('\u{1F3C1} ' + r.name + ' (' + r.team + ') WINS THE STAGE!');
      }
    }
  });

  detectEvents();
  checkKeyMoments();

  if(R.riders.every(r=>r.finished)){ stopRace(); finishStage(); return; }
  R.uiDirty = true;
}

function detectEvents(){
  const R = G.race;
  const lead = R.groups[0];
  const pel = R.groups.find(g=>g.name==='Peloton');
  const xPct = (lead?lead.leadDist:0)/R.distTotal*100;

  if(!R.breakAnnounced && lead && lead.name==='Breakaway' && pel && pel.gap > 30){
    R.breakAnnounced = true;
    const names = lead.members.slice(0,5).map(r=>r.name).join(', ');
    pushEvent('A breakaway of ' + lead.members.length + ' has gone clear: ' + names + '.');
  }
  if(!R.chaseAnnounced && R.breakAnnounced && pel && pel.gap > 150){
    R.chaseAnnounced = true;
    pushEvent('The gap is over 2:30 — the sprinters\u2019 teams move to the front to chase.');
  }
  const climbGrad = gradientAt(R.pkey, xPct, R.distTotal);
  if(climbGrad > 5 && xPct - R.lastClimbEvent > 14){
    R.lastClimbEvent = xPct;
    pushEvent('The road pitches up — the bunch begins to shrink on the climb.');
  }
  if(!R.finalKmAnnounced && xPct > 99){
    R.finalKmAnnounced = true;
    pushEvent('Flamme rouge — the final kilometre!');
  }
}

function startRaceLoop(){
  stopRace();
  G.race.timer = setInterval(()=>{
    const hadAlert = G.race ? !!G.race.alert : false;
    raceTick();
    if(!G.race || G.screen!=='race') return;
    if(G.race.alert && !hadAlert) render();      // a key moment: stop and show it
    else if(!G.race.alert) updateRaceUI();
  }, 80);
}
function stopRace(){
  if(G.race && G.race.timer){ clearInterval(G.race.timer); G.race.timer=null; }
}
function toggleRun(){ if(G.race.alert) return; G.race.running = !G.race.running; updateRaceUI(); }
function setSpeedMult(m){ G.race.speedMult = m; updateRaceUI(); }
function setOrder(riderId, key){
  const r = G.race.riders.find(x=>x.id===riderId);
  if(!r || r.finished) return;
  lockPanel();
  setOrd(r, key);
  updateRaceUI();
}
function setAllOrders(key){
  G.race.riders.filter(r=>r.mine && !r.finished).forEach(r => setOrd(r, key));
  updateRaceUI();
}
function setTTZone(riderId, key){
  const r = G.race.riders.find(x=>x.id===riderId);
  if(!r || r.finished) return;
  setZone(r, key);
  updateRaceUI();
}
function setAllZones(key){
  G.race.riders.filter(r=>r.mine && !r.finished).forEach(r => setZone(r, key));
  updateRaceUI();
}
/* Send one rider up the road and have the rest of the team sit on --
   the classic "put a man in the move" call. */
function launchAttack(riderId){
  const R = G.race;
  const r = R.riders.find(x=>x.id===riderId);
  if(!r || r.finished) return;
  setOrd(r, 'attack');
  R.riders.filter(x=>x.mine && !x.finished && x.id!==riderId).forEach(x=>setOrd(x,'follow'));
  pushEvent(r.name + ' attacks \u2014 the rest of the team sits on and refuses to work.');
  updateRaceUI();
}
/* ============ VIRTUAL GC ============
   The classification as it stands right now, on the road. */
function virtualGC(R){
  // A rider's virtual stage time is the clock at the head of the race plus however
  // far behind the leader he currently is — not an extrapolation to the finish.
  const lead = R.groups[0] ? R.groups[0].leadDist : 0;
  return R.riders.map(r => {
    const stageTime = r.finished
      ? r.finishTime
      : R.t + (lead - r.dist)/Math.max(8, r.speed)*3600;
    return {id:r.id, name:r.name, emoji:r.emoji, role:r.role, team:r.team, mine:r.mine,
            stageGap:(lead - r.dist)/Math.max(8, r.speed)*3600,
            total:(G.gcTimes[r.id]||0) + stageTime};
  }).sort((a,b)=> a.total - b.total);
}

/* ============ AUTO COACH (used when simulating) ============ */
function teamCaptain(R){
  const list = R.riders.filter(r=>r.mine && !r.finished);
  if(!list.length) return null;
  const key = terrainStatKey(R.type);
  return list.slice().sort((a,b)=> b.stats[key]-a.stats[key])[0];
}
/* The rider you are riding the general classification for. He can be changed at
   any point in the stage — if your leader cracks, promote someone else. */
function gcLeader(R){
  if(!R) return null;
  const byId = R.riders.find(r=>r.id===R.gcLeaderId);
  if(byId) return byId;
  return R.riders.filter(r=>r.mine).slice()
          .sort((a,b)=> (G.gcTimes[a.id]||0) - (G.gcTimes[b.id]||0))[0] || null;
}
function setGcLeader(id){
  const R = G.race; if(!R) return;
  const r = R.riders.find(x=>x.id===id); if(!r) return;
  R.gcLeaderId = id;
  pushEvent(r.name + ' is now your rider for the general classification.');
  render();
}
function autoCoach(R){
  const list = R.riders.filter(r=>r.mine && !r.finished);
  if(!list.length) return;
  if(R.type === 'tt'){
    list.forEach(r => {
      const x = r.dist/R.distTotal*100;
      setZone(r, x > 82 ? 'vo2' : (x > 30 ? 'thr' : 'thr'));
      if(x > 94) setZone(r,'max');
    });
    return;
  }
  const cap = (R.gcLeaderId ? gcLeader(R) : null) || teamCaptain(R);
  const sprintFinish = (R.type==='flat' || R.type==='cobbles');
  const fastMan = list.slice().sort((a,b)=> b.stats.sprint-a.stats.sprint)[0];
  // only the two freshest domestiques do the work; the finisher is kept hidden
  const finisher = sprintFinish ? (fastMan || cap) : cap;
  const workers = list.filter(r => !finisher || r.id !== finisher.id)
                      .sort((a,b)=> b.energy - a.energy).slice(0,2).map(r=>r.id);
  list.forEach(r => {
    const x = r.dist/R.distTotal*100;
    const isFinisher = finisher && r.id === finisher.id;
    const isWorker = workers.indexOf(r.id) !== -1;
    if(isFinisher){
      const launchAt = sprintFinish ? 98.6 : 93;
      if(x < launchAt) setOrd(r, x < 70 ? 'relax' : 'follow');
      else setOrd(r,'attack');
      return;
    }
    if(x < 55) setOrd(r,'follow');
    else if(x < 92) setOrd(r, isWorker && r.energy > 45 ? 'pull' : 'follow');
    else setOrd(r, r.energy > 30 ? 'pull' : 'follow');
  });
}

/* Run the remainder of the stage without the player, resolving any
   key moments with the coach's own judgement. */
function simulateToFinish(){
  const R = G.race;
  if(!R) return;
  stopRace();
  R.autoSim = true;
  R.running = true;
  let guard = 0;
  while(R.riders.some(r=>!r.finished) && guard < 200000){
    autoCoach(R);
    R.alert = null;          // the coach does not stop for anything
    R.preRace = false;
    R.running = true;
    raceTick();
    guard++;
    if(!G.race) return;   // finishStage already fired
  }
  if(G.race){ stopRace(); finishStage(); }
}

/* ============ KEY-MOMENT DECISIONS ============
   These briefly stop the race, ask the sporting director what to do,
   apply the consequences, and then let the simulation resume. */

const mine   = (R) => R.riders.filter(r=>r.mine && !r.finished);
function bestMineFor(R, statKey){
  const list = mine(R);
  if(!list.length) return null;
  return list.slice().sort((a,b)=> b.stats[statKey]-a.stats[statKey])[0];
}
function bestMineByRole(R, role){ return mine(R).find(r=>r.role===role) || null; }
function terrainStatKey(type){
  if(type==='mountain' || type==='medium') return 'mountain';
  if(type==='hilly' || type==='uphill') return 'hill';
  if(type==='tt') return 'tt';
  if(type==='cobbles') return 'endurance';
  return 'sprint';
}

/* ---- context helpers so every pop-up can describe the real race situation ---- */
function frontGroup(R){ return R.groups[0]; }
function myLeadRider(R){
  const list = mine(R);
  return list.length ? list.slice().sort((a,b)=>b.dist-a.dist)[0] : null;
}
function groupOf(R, r){ return r ? R.groups[r.groupIdx] : null; }
function gapSecs(R, fromDist){
  const lead = R.groups[0] ? R.groups[0].leadDist : fromDist;
  const g = R.groups[0];
  return (lead - fromDist)/Math.max(6, g?g.pace:35)*3600;
}
function amIInFront(R){
  const me = myLeadRider(R);
  return me && R.groups[0] && R.groups[0].members.indexOf(me) !== -1;
}
function situationLine(R){
  const me = myLeadRider(R);
  if(!me) return '';
  const g = groupOf(R, me);
  const gap = gapSecs(R, me.dist);
  if(!g) return '';
  if(gap < 2) return `${me.name} is in the front group (${g.members.length} riders).`;
  return `${me.name} is in the ${g.name.toLowerCase()} (${g.members.length} riders), ${fmtGap(gap)} down.`;
}
function rivalsAhead(R, n){
  const me = myLeadRider(R);
  if(!me) return [];
  return R.riders.filter(x=>!x.mine && x.dist > me.dist && !x.finished)
                 .sort((a,b)=>b.dist-a.dist).slice(0,n);
}

/* ============ KEY MOMENTS ============
   No choices to pick from. When something decisive actually happens in the
   simulation the race stops and tells you, and you react with the normal
   orders panel — attack, pull, follow, relax, or swap your GC leader. */

function raceAlert(R, title, text){
  const lead = R.groups[0] ? R.groups[0].leadDist : 0;
  R.alert = {title, text, km: Math.max(0, R.distTotal - lead)};
  R.running = false;
  pushEvent(title + ' \u2014 ' + text.replace(/<[^>]+>/g,''));
}

function checkKeyMoments(){
  const R = G.race;
  if(R.alert || R.autoSim || R.preRace) return;
  const lead   = R.groups[0] ? R.groups[0].leadDist : 0;
  const pct    = lead/R.distTotal*100;
  const kmToGo = R.distTotal - lead;
  const front  = R.groups[0];
  const pel    = R.groups.find(g=>g.name==='Peloton');
  const F = R.firedEvents;
  const mineRacing = R.riders.filter(r=>r.mine && !r.finished);
  const grad = gradientAt(R.pkey, pct, R.distTotal);
  const road = (R.type !== 'tt');   // a time trial has no bunch, no break, no attacks

  if(road && !F.breakGone && front && front.name==='Breakaway' && pel && pel.gap > 35){
    F.breakGone = true;
    const names = front.members.slice(0,5).map(r=>(r.mine?'<strong>':'')+r.name+' ('+r.role+')'+(r.mine?'</strong>':'')).join(', ');
    const hasMine = front.members.some(r=>r.mine);
    return raceAlert(R, 'A BREAKAWAY HAS GONE CLEAR',
      front.members.length+' riders are away with '+fmtGap(pel.gap)+': '+names+'.' +
      (hasMine ? ' You are represented in the move.' : ' You have nobody in it \u2014 chase now, or let it go.'));
  }

  if(road && !F.gapBig && pel && pel.gap > 210 && pct < 80){
    F.gapBig = true;
    return raceAlert(R, 'THE GAP IS GROWING',
      'The escape now leads by '+fmtGap(pel.gap)+'. If nobody commits to the chase this stage is gone.');
  }

  if(road && F.breakGone && !F.breakCaught && kmToGo > 3 && pct > 55 && (!front || front.name!=='Breakaway' || (pel && pel.gap < 6))){
    F.breakCaught = true;
    return raceAlert(R, 'THE BREAKAWAY IS CAUGHT',
      'The escape has been reeled in. Everything comes back together for the finale.');
  }

  const attackers = road && kmToGo > 2.5
    ? R.riders.filter(r => !r.mine && !r.finished && r.effort >= 100 &&
        pct > 55 && front && r.dist >= front.leadDist - 0.05)
    : [];
  if(attackers.length && (R.t - (F.lastAttackT||-9999)) > 900 && (F.attackCount||0) < 4){
    F.lastAttackT = R.t; F.attackCount = (F.attackCount||0)+1;
    const a = attackers.sort((x,y)=>y.dist-x.dist)[0];
    const boss = gcLeader(R);
    return raceAlert(R, 'ATTACK!',
      '<strong>'+a.name+'</strong> ('+a.role+', '+a.team+') has kicked clear' +
      (grad > 3 ? ' on the climb' : '') + '. ' +
      (boss ? boss.name+' is your man for the overall \u2014 follow him, send someone across, or ride your own tempo.' : ''));
  }

  if(!F.mech && pct > 22 && pct < 80 && Math.random() < 0.0025 && mineRacing.length){
    F.mech = true;
    const v = mineRacing[Math.floor(Math.random()*mineRacing.length)];
    v.dist = Math.max(0, v.dist - 0.45);
    return raceAlert(R, 'MECHANICAL',
      '<strong>'+v.name+'</strong> has stopped for a wheel change and lost contact with his group. ' +
      'He is riding again but will need help, or a big effort of his own, to get back on.');
  }

  if(!F.crash && pct > 30 && pct < 85 && Math.random() < 0.0022 && mineRacing.length){
    F.crash = true;
    const v = mineRacing[Math.floor(Math.random()*mineRacing.length)];
    v.dist = Math.max(0, v.dist - 0.6);
    v.energy = clamp(v.energy - 5, 0, 100);
    return raceAlert(R, 'CRASH',
      '<strong>'+v.name+'</strong> has gone down in a touch of wheels. He is back on the bike but off the back ' +
      'and shaken. Send teammates back for him, or leave him to chase alone?');
  }

  if(road && !F.echelon && (R.type==='flat'||R.type==='cobbles') && pct > 30 && pct < 70 && Math.random() < 0.004){
    F.echelon = true;
    const victims = mineRacing.filter(()=>Math.random()<0.4);
    victims.forEach(r => { r.dist = Math.max(0, r.dist - 0.4); });
    return raceAlert(R, 'CROSSWIND \u2014 THE BUNCH IS SPLITTING',
      'Echelons are forming across the road. ' +
      (victims.length ? '<strong>'+victims.map(r=>r.name).join(', ')+'</strong> '+(victims.length>1?'are':'is')+' caught on the wrong side.'
                      : 'Your riders have made the front split \u2014 for now.'));
  }

  const newlyCracked = mineRacing.filter(r => r.cracked && !F['crk_'+r.id]);
  if(newlyCracked.length){
    const r = newlyCracked[0];
    F['crk_'+r.id] = true;
    const boss = gcLeader(R);
    return raceAlert(R, 'YOUR RIDER HAS BLOWN UP',
      '<strong>'+r.name+'</strong> is empty \u2014 there is nothing left in the tank.' +
      (boss && boss.id===r.id ? ' He is your rider for the general classification: you may want to hand that role to someone else.' : ''));
  }

  const boss = gcLeader(R);
  if(road && boss && !boss.finished && !F.bossDropped && pct > 35 && front){
    const bg = R.groups[boss.groupIdx];
    if(bg && bg !== front && bg.gap > 45){
      F.bossDropped = true;
      return raceAlert(R, 'YOUR LEADER HAS LOST CONTACT',
        '<strong>'+boss.name+'</strong> has been distanced and is '+fmtGap(bg.gap)+' behind the front of the race. ' +
        'Send riders back to pace him, or accept the loss and ride for someone else.');
    }
  }

  const climbs = road ? (CLIMBS[R.pkey] || []) : [];
  for(let i=0;i<climbs.length;i++){
    const c = climbs[i];
    if(pct >= c.s && !F['clb_'+i]){
      F['clb_'+i] = true;
      return raceAlert(R, 'THE ROAD TURNS UP',
        'The race hits <strong>'+c.name+'</strong>. The bunch will start to come apart here.');
    }
  }

  if(!F.flamme && kmToGo <= 1.05){
    F.flamme = true;
    if(!road){
      const closest = mineRacing.slice().sort((a,b)=>b.dist-a.dist)[0];
      return raceAlert(R, 'FINAL KILOMETRE',
        'One kilometre left against the clock.' +
        (closest ? ' <strong>'+closest.name+'</strong> has '+Math.round(closest.energy)+'% left \u2014 anything still in the tank after the line is wasted.' : ''));
    }
    const inFront = mineRacing.filter(r => front && R.groups[r.groupIdx]===front);
    return raceAlert(R, 'FLAMME ROUGE \u2014 FINAL KILOMETRE',
      'One kilometre to go. ' +
      (inFront.length ? '<strong>'+inFront.map(r=>r.name).join(', ')+'</strong> '+(inFront.length>1?'are':'is')+' in the front group. Last chance to launch.'
                      : 'You have nobody in the leading group.'));
  }
}

function dismissAlert(resume){
  const R = G.race;
  if(!R) return;
  R.alert = null;
  R.running = !!resume;
  render();
}

/* ===================== RACE UI ===================== */

/* Colour a stretch of road by how hard it is. */
function gradeColor(g){
  if(g >= 9)  return '#7a0d0d';
  if(g >= 6.5)return '#b32020';
  if(g >= 4)  return '#e0503f';
  if(g >= 2)  return '#f2994a';
  if(g >= 0.7)return '#e8c84a';
  if(g <= -3) return '#3f7fd6';
  if(g <= -1) return '#5aa0e0';
  return '#5f9e4a';
}

/* The route drawing itself: a filled profile shaded kilometre by kilometre. */
function profileSvg(){
  const R = G.race;
  const key = R.pkey;
  const {min,max} = elevRange(key);
  const H = 100, span = Math.max(1, max-min);
  const yFor = e => H - ((e-min)/span)*(H-14) - 6;
  const pts = ELEVATION[key];
  const line = pts.map(p=>`${p[0]},${yFor(p[1]).toFixed(2)}`).join(' ');

  // one shaded column per 0.4% of the stage, coloured by that stretch's gradient
  let bands = '';
  for(let x=0; x<100; x+=0.4){
    const g = gradientAt(key, x+0.2, R.distTotal);
    const yTop = yFor(elevAt(key, x+0.2));
    bands += `<rect x="${x.toFixed(2)}" y="${yTop.toFixed(2)}" width="0.42" height="${(H-yTop).toFixed(2)}"
      fill="${gradeColor(g)}" opacity="0.92"/>`;
  }
  let grid = '';
  for(let i=1;i<10;i++) grid += `<line x1="${i*10}" y1="0" x2="${i*10}" y2="${H}"
    stroke="#ffffff" stroke-width="0.12" opacity="0.18"/>`;

  return `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none"
      style="width:100%;height:100%;display:block;background:linear-gradient(180deg,#0d1f3d 0%,#16305c 100%);">
    ${grid}${bands}
    <polyline points="${line}" fill="none" stroke="#ffffff" stroke-width="0.5"
      vector-effect="non-scaling-stroke" opacity="0.85"/>
  </svg>`;
}

/* Labels and markers sit in HTML on top of the drawing so text stays crisp.
   Flags are stacked into rows when groups bunch up, and each one drops a stem
   to the exact point on the road where that group is. */
function climbGradient(key, c, distKm){
  const rise = elevAt(key, c.e) - elevAt(key, c.s);
  const run  = ((c.e - c.s)/100) * distKm * 1000;
  return run > 0 ? (rise/run)*100 : 0;
}

function profileOverlayHtml(){
  const R = G.race;
  const key = R.pkey;
  const {min,max} = elevRange(key);
  const span = Math.max(1, max-min);
  const roadTopPct = e => 100 - (((e-min)/span)*84 + 10);   // % from the top of the box

  const lead = R.groups[0] ? R.groups[0].leadDist : 0;
  const leadPct = clamp(lead/R.distTotal*100, 0, 100);
  let out = '';

  out += `<div class="pf-done" style="width:${leadPct}%;"></div>`;
  out += `<div class="pf-leadline" style="left:${leadPct}%;"></div>`;

  (CLIMBS[key]||[]).forEach(c=>{
    const g = climbGradient(key, c, R.distTotal);
    const x = clamp(c.e, 4, 95);
    const y = roadTopPct(elevAt(key, c.e));
    const passed = leadPct > c.e;
    const cat = String(c.cat);
    const nm = c.name.replace(/^(Cat\.\d+|HC)\s*/,'');
    out += `<div class="pf-climbspan ${passed?'passed':''}" style="left:${c.s}%; width:${Math.max(0.6,c.e-c.s)}%;"></div>`;
    out += `<div class="pf-climb ${passed?'passed':''}" style="left:${x}%; top:calc(${y}% - 18px);">
        <span class="pf-cat cat-${cat.replace('.','')}">${cat}</span>
        <span class="pf-cname">${nm}</span><span class="pf-cgrad">${g.toFixed(1)}%</span>
      </div>`;
  });

  for(let i=1;i<10;i++){
    const kmLeft = R.distTotal*(1-i/10);
    out += `<div class="pf-tick" style="left:${i*10}%;"></div>`;
    if(i%2===0) out += `<div class="pf-km" style="left:${i*10}%;">${kmLeft.toFixed(0)}km</div>`;
  }
  out += `<div class="pf-edge pf-start">START</div><div class="pf-edge pf-finish">FINISH</div>`;
  out += `<div class="pf-alt pf-alt-hi">${max}m</div><div class="pf-alt pf-alt-lo">${min}m</div>`;

  // ---- one dot per group, sitting on the road ----
  const dots = raceDots();
  dots.forEach(d=>{
    const y = roadTopPct(elevAt(key, d.x));
    out += `<div class="pf-dot ${d.big?'big':''} ${d.mine?'mine':''}"
        style="left:${d.x}%; top:${y}%; background:${d.col};">${d.n||''}</div>`;
    if(d.tag) out += `<div class="pf-dotlbl" style="left:${d.x}%; top:calc(${y}% - 13px);">${d.tag}</div>`;
  });
  return out;
}

/* Everything that gets a dot on the road, in one place. */
function raceDots(){
  const R = G.race;
  if(R.type === 'tt'){
    return R.riders.filter(r=>r.mine && !r.finished).map(r=>({
      x: clamp(r.dist/R.distTotal*100, 0, 100), col:'#f4c430', mine:true, n:'',
      tag:r.name.split(' ').pop().toUpperCase(), big:false,
      kph:r.speed, grad:gradientAt(R.pkey, clamp(r.dist/R.distTotal*100,0,100), R.distTotal),
      name:r.name.split(' ').pop().toUpperCase(), gap:'',
    }));
  }
  return R.groups.map(g=>{
    const mine = g.members.filter(r=>r.mine && !r.finished).length;
    const isBreak = g.name==='Breakaway', isPel = g.name==='Peloton';
    const live = g.members.filter(r=>!r.finished);
    const kph = live.length ? live.reduce((a,r)=>a+r.speed,0)/live.length : 0;
    const grad = gradientAt(R.pkey, clamp(g.avgDist/R.distTotal*100,0,100), R.distTotal);
    return { kph, grad,
      x: clamp(g.avgDist/R.distTotal*100, 0, 100),
      col: isBreak?'#f2994a':(isPel?'#6ec8ff':(g.cls==='chase'?'#f4c430':'#e6483f')),
      n: g.members.length, mine, big: g.members.length >= 8,
      tag: mine ? '\u2605'+mine : '',
      name: isBreak?'BREAK':(isPel?'PELOTON':(g.name==='Chase group'?'CHASE':
            (g.name==='Grupetto'?'GRUPETTO':'DROPPED'))),
      gap: g.gap<1?'LEAD':fmtGap(g.gap),
    };
  });
}

/* The strip under the chart is deliberately simple: the four states of the
   race, not every splinter group. The full breakdown lives in the panel on
   the right. */
function groupBuckets(){
  const R = G.race;
  const order = ['Breakaway','Chase','Peloton','Dropped'];
  const cols  = {Breakaway:'#f2994a', Chase:'#f4c430', Peloton:'#6ec8ff', Dropped:'#e6483f'};
  const map = {};
  R.groups.forEach(g=>{
    let key;
    if(g.name === 'Breakaway')      key = 'Breakaway';
    else if(g.cls === 'chase')      key = 'Chase';
    else if(g.name === 'Peloton')   key = 'Peloton';
    else                            key = 'Dropped';
    if(!map[key]) map[key] = {name:key, col:cols[key], n:0, mine:0, gap:g.gap, groups:0};
    map[key].n     += g.members.length;
    map[key].mine  += g.members.filter(r=>r.mine && !r.finished).length;
    map[key].groups++;
    map[key].gap    = Math.min(map[key].gap, g.gap);   // the front of that bucket
  });
  return order.filter(k=>map[k]).map(k=>map[k]);
}

function profileLegendHtml(){
  const R = G.race;
  if(R.type === 'tt') return '';
  return `<div class="pf-legend">` + groupBuckets().map(b=>`
    <div class="pf-lg ${b.mine?'mine':''}">
      <i style="background:${b.col};"></i>
      <span>${b.name} <span class="n">${b.n}</span></span>
      <span class="g">${b.gap<1?'LEAD':fmtGap(b.gap)}</span>
      ${b.groups>1?`<span class="n">${b.groups} grps</span>`:''}
      ${b.mine?`<span style="color:var(--gold);font-size:13px;">\u2605${b.mine}</span>`:''}
    </div>`).join('') + `</div>`;
}

/* ---------- LIVE ZOOM ----------
   The main chart shows only the stretch of road the race is actually on, so the
   gradient under the wheels and the distance between groups are both readable. */
function profileWindow(){
  const R = G.race;
  let front, back;
  if(R.type === 'tt'){
    const ds = R.riders.filter(r=>r.mine).map(r=>r.dist);
    front = Math.max.apply(null, ds.concat([0]));
    back  = Math.min.apply(null, ds.concat([front]));
  } else {
    const ds = R.groups.map(g=>g.avgDist);
    front = Math.max.apply(null, ds.concat([0]));
    // ignore anyone more than 9 km adrift, or the view zooms out to nothing
    const near = ds.filter(d => front - d <= 9);
    back = Math.min.apply(null, near.concat([front]));
  }
  let s0 = Math.max(0, back - 1.0);
  let e0 = Math.min(R.distTotal, front + 5.5);
  const minSpan = 9;
  if(e0 - s0 < minSpan){
    const mid = (s0 + e0)/2;
    s0 = Math.max(0, mid - minSpan/2);
    e0 = Math.min(R.distTotal, s0 + minSpan);
    s0 = Math.max(0, e0 - minSpan);
  }
  return {s:s0, e:e0, span:Math.max(0.1, e0-s0)};
}

function zoomSvg(win){
  const R = G.race, key = R.pkey;
  const N = 200;
  const pts = [], grads = [];
  for(let i=0;i<=N;i++){
    const km = win.s + win.span*(i/N);
    const xp = km/R.distTotal*100;
    pts.push(elevAt(key, xp));
    grads.push(gradientAt(key, xp, R.distTotal));
  }
  let lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
  const pad = Math.max(12, (hi-lo)*0.28);
  lo -= pad; hi += pad;
  const H = 100, span = Math.max(1, hi-lo);
  const yFor = e => H - ((e-lo)/span)*(H-10) - 4;
  const line = pts.map((e,i)=>`${(i/N*100).toFixed(2)},${yFor(e).toFixed(2)}`).join(' ');
  let bands = '';
  for(let i=0;i<N;i++){
    const x = i/N*100, w = 100/N + 0.06;
    const yT = yFor(pts[i]);
    bands += `<rect x="${x.toFixed(2)}" y="${yT.toFixed(2)}" width="${w.toFixed(2)}"
      height="${(H-yT).toFixed(2)}" fill="${gradeColor(grads[i])}"/>`;
  }
  let grid = '';
  for(let i=1;i<8;i++) grid += `<line x1="${i*12.5}" y1="0" x2="${i*12.5}" y2="${H}"
    stroke="#fff" stroke-width="0.1" opacity="0.16"/>`;
  return {svg:`<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none"
      style="width:100%;height:100%;display:block;background:linear-gradient(180deg,#0d1f3d,#16305c);">
      ${grid}${bands}
      <polyline points="${line}" fill="none" stroke="#fff" stroke-width="0.55"
        vector-effect="non-scaling-stroke" opacity="0.9"/>
    </svg>`, lo, hi, yFor};
}

function zoomOverlayHtml(win, z){
  const R = G.race, key = R.pkey;
  const toX = km => ((km - win.s)/win.span)*100;
  const yPct = e => ((z.yFor(e))/100)*100;
  let out = '';

  // distance ruler across the window
  const stepKm = win.span > 25 ? 5 : (win.span > 12 ? 2 : 1);
  for(let km = Math.ceil(win.s/stepKm)*stepKm; km < win.e; km += stepKm){
    const x = toX(km);
    out += `<div class="zm-tick" style="left:${x}%;"></div>`;
    out += `<div class="zm-km" style="left:${x}%;">${(R.distTotal-km).toFixed(0)}</div>`;
  }
  // gradient callouts along the road
  for(let i=0;i<6;i++){
    const km = win.s + win.span*((i+0.5)/6);
    const xp = km/R.distTotal*100;
    const g = gradientAt(key, xp, R.distTotal);
    if(Math.abs(g) < 1.6) continue;
    out += `<div class="zm-grad" style="left:${toX(km)}%; top:calc(${yPct(elevAt(key,xp))}% - 17px);
      color:${g>0?'#ffd24a':'#8fd0ff'};">${g>0?'':''}${g.toFixed(1)}%</div>`;
  }
  // named climbs falling inside the window
  (CLIMBS[key]||[]).forEach(c=>{
    const kmEnd = c.e/100*R.distTotal;
    if(kmEnd < win.s || kmEnd > win.e) return;
    const cat = String(c.cat);
    out += `<div class="zm-climb" style="left:${clamp(toX(kmEnd),3,96)}%;
      top:calc(${yPct(elevAt(key,c.e))}% - 34px);">
      <span class="pf-cat cat-${cat.replace('.','')}">${cat}</span>
      ${c.name.replace(/^(Cat\.\d+|HC)\s*/,'')}</div>`;
  });

  // the dots, and the road distance between them
  const dots = raceDots().map(d=>({...d, km: d.x/100*R.distTotal})).sort((a,b)=>b.km-a.km);
  dots.forEach((d,i)=>{
    const inside = d.km >= win.s && d.km <= win.e;
    if(!inside){
      if(d.km < win.s) out += `<div class="zm-off" style="left:4px; top:${6 + (i%3)*18}px;">\u25c0 ${d.name} ${d.n} \u00b7 ${d.gap}</div>`;
      return;
    }
    const x = toX(d.km);
    const y = yPct(elevAt(key, d.km/R.distTotal*100));
    out += `<div class="zm-dot ${d.big?'big':''} ${d.mine?'mine':''}"
      style="left:${x}%; top:${y}%; background:${d.col};">${d.n||''}</div>`;
    const arrow = d.grad > 1.5 ? '\u25b2' : (d.grad < -1.5 ? '\u25bc' : '');
    const spdCol = d.grad > 1.5 ? '#ff9b6b' : (d.grad < -1.5 ? '#8fd0ff' : '#ffffff');
    out += `<div class="zm-lbl" style="left:${x}%; top:calc(${y}% - 40px);">
      ${d.name}${d.mine?` <span style="color:#f4c430;">\u2605${d.mine}</span>`:''}</div>`;
    out += `<div class="zm-spd" style="left:${x}%; top:calc(${y}% - 27px); color:${spdCol};">
      ${arrow}${(d.kph||0).toFixed(0)} km/h</div>`;
    // how far back the next group is, drawn along the road
    const nxt = dots[i+1];
    if(nxt && nxt.km >= win.s && nxt.km <= win.e){
      const x2 = toX(nxt.km);
      const midX = (x + x2)/2, gapKm = d.km - nxt.km;
      out += `<div class="zm-span" style="left:${x2}%; width:${Math.max(0,x-x2)}%;"></div>`;
      if(x - x2 > 6) out += `<div class="zm-spanlbl" style="left:${midX}%;">${gapKm<1?(gapKm*1000).toFixed(0)+'m':gapKm.toFixed(1)+'km'} \u00b7 ${nxt.gap}</div>`;
    }
  });
  return out;
}

/* ---------- OVERVIEW ----------
   The whole stage, small, with the zoomed window marked on it. */
function miniProfileHtml(win){
  const R = G.race;
  const x1 = clamp(win.s/R.distTotal*100, 0, 100);
  const w  = clamp(win.span/R.distTotal*100, 0.5, 100);
  const dots = raceDots();
  const key = R.pkey;
  const {min,max} = elevRange(key);
  const span = Math.max(1, max-min);
  const roadTopPct = e => 100 - (((e-min)/span)*80 + 10);
  let marks = dots.map(d=>`<div class="mini-dot ${d.mine?'mine':''}"
      style="left:${d.x}%; top:${roadTopPct(elevAt(key,d.x))}%; background:${d.col};"></div>`).join('');
  (CLIMBS[key]||[]).forEach(c=>{
    marks += `<div class="mini-climb" style="left:${c.s}%; width:${Math.max(0.5,c.e-c.s)}%;"></div>`;
  });
  return `<div class="mini-wrap">
      ${profileSvg()}
      <div class="mini-overlay">
        ${marks}
        <div class="mini-win" style="left:${x1}%; width:${w}%;"></div>
      </div>
    </div>
    <div class="mini-cap"><span>FULL STAGE \u00b7 ${R.distTotal} km</span>
      <span>showing ${win.s.toFixed(0)}\u2013${win.e.toFixed(0)} km</span></div>`;
}

function profileBlockHtml(){
  const win = profileWindow();
  const z = zoomSvg(win);
  return `<div class="zm-wrap">${z.svg}<div class="zm-overlay">${zoomOverlayHtml(win, z)}</div></div>
    ${profileLegendHtml()}
    ${miniProfileHtml(win)}`;
}

function groupsHtml(){
  const R = G.race;
  if(R.type === 'tt'){
    const order = R.riders.slice().sort((a,b)=> b.dist - a.dist).slice(0,10);
    const leadDist = order.length ? order[0].dist : 0;
    return `<div class="grp peloton"><div class="grp-head">
        <span class="grp-name">AGAINST THE CLOCK</span>
        <span class="grp-gap">no shelter, no help</span></div>
      <div class="grp-mem">` + order.map((r,i) => {
        const gap = (leadDist - r.dist)/Math.max(6,r.speed)*3600;
        const label = (i===0?'leader':fmtGap(gap));
        return (r.mine? `<span class="mine">${r.emoji} ${r.name} (${label})</span>` : `${r.name} (${label})`);
      }).join(', ') + `</div></div>`;
  }
  return R.groups.map(g => {
    const mineM = g.members.filter(r=>r.mine);
    const others = g.members.filter(r=>!r.mine);
    // for the escape groups, show what kind of rider each man is
    const showRoles = (g.name==='Breakaway' || g.cls==='chase' || g.members.length <= 9);
    const tag = r => showRoles ? `${r.name} <span style="opacity:.75">(${r.role})</span>` : r.name;
    const shown = [];
    mineM.forEach(r => shown.push(`<span class="mine">${r.emoji} ${r.name} (${r.role})</span>`));
    const room = Math.max(0, 8-mineM.length);
    others.slice(0, room).forEach(r => shown.push(tag(r)));
    const more = others.length - room;
    const memberTxt = shown.join(', ') + (more>0 ? ` <span style="opacity:.7">+${more} more</span>` : '');
    const kmToGo = (R.distTotal - g.avgDist);
    return `<div class="grp ${g.cls}">
      <div class="grp-head">
        <span class="grp-name">${g.name} (${g.members.length})</span>
        <span class="grp-gap">${g.gap<1?'LEADING':fmtGap(g.gap)} · ${kmToGo.toFixed(1)}km to go</span>
      </div>
      <div class="grp-mem">${memberTxt}</div>
    </div>`;
  }).join('');
}

function riderCtlHtml(r, R){
  const nrg = Math.round(r.energy);
  const scale = (10000/Math.max(nrg,1)).toFixed(0);
  const boss = gcLeader(R);
  const isBoss = boss && boss.id === r.id;
  const mates = r._mates || 0;
  const ordRow = ORDERS.map(o =>
    `<button id="ord-${r.id}-${o.key}" class="${r.order===o.key?'on':''} ${o.key==='attack'?'mx':''}"
      data-act="order" data-id="${r.id}" data-arg="${o.key}"
      title="${o.desc}">${o.label}</button>`).join('');
  return `<div class="rctl" id="rctl-${r.id}">
    <div class="rc-top">
      <button class="lead-btn ${isBoss?'on':''}" data-act="leader" data-id="${r.id}"
        title="Ride the general classification for this rider">\u2605</button>
      <span class="rc-name">${r.emoji} ${r.name}</span>
      <span class="rc-role">${r.role}</span>
      ${mates?`<span class="matetag" title="sheltered by ${mates} teammate(s)">\u25c0 ${mates}</span>`:''}
    </div>
    <div class="rc-mid">
      <span class="rc-end">END ${r.stats.endurance}</span>
      <span class="rc-nrg"><i id="rcnrg-${r.id}" style="width:${nrg}%; background-size:${scale}% 100%;"></i></span>
      <span class="rc-pct" id="rcpct-${r.id}">${nrg}%</span>
      <span id="rcst-${r.id}"></span>
      <button class="solo-btn" data-act="solo" data-id="${r.id}"
        title="Send this rider clear and have the rest of the team sit on">SEND CLEAR</button>
    </div>
    <div class="rc-eff" id="rceff-${r.id}">${ordRow}</div>
  </div>`;
}

/* The team panel is organised BY GROUP: you give orders to the riders in the
   breakaway separately from the ones sitting in the peloton. */
function teamHtml(){
  const R = G.race;
  let out = '';
  R.groups.forEach(g => {
    let mineIn = g.members.filter(r=>r.mine && !r.finished);
    if(!mineIn.length) return;
    mineIn = mineIn.slice().sort((a,b)=> b.dist - a.dist);
    const ids = mineIn.map(r=>r.id).join(',');
    const kmToGo = (R.distTotal - g.avgDist);
    out += `<div class="grpctl ${g.cls}">
      <div class="grpctl-head">
        <span class="grpctl-name">${g.name} \u00b7 ${mineIn.length} of yours in a group of ${g.members.length}</span>
        <span class="grpctl-gap">${g.gap<1?'LEADING':fmtGap(g.gap)} \u00b7 ${kmToGo.toFixed(1)}km</span>
      </div>
      <div class="grpctl-orders">
        <span class="lbl">GROUP:</span>
        ${['relax','follow','pull','attack'].map(k=>
          `<button data-act="gorder" data-id="${ids}" data-arg="${k}">${ORDER_BY_KEY[k].label}</button>`).join('')}
      </div>
      ${mineIn.map(r=>riderCtlHtml(r, R)).join('')}
    </div>`;
  });
  const fin = R.riders.filter(r=>r.mine && r.finished);
  if(fin.length){
    out += `<div class="grpctl"><div class="grpctl-head">
      <span class="grpctl-name">FINISHED</span></div>
      <div class="grp-mem" style="padding:4px 2px;">${fin.map(r=>r.emoji+' '+r.name).join(', ')}</div></div>`;
  }
  return out || '<div class="flavor">No riders on the road.</div>';
}

/* One panel: where every group is on the road AND the orders for your riders
   inside it. The two used to be separate cards saying the same thing twice. */
function mergedRaceHtml(){
  const R = G.race;
  return R.groups.map((g, i) => {
    const mineIn = g.members.filter(r=>r.mine && !r.finished);
    const others = g.members.filter(r=>!r.mine);
    const showRoles = (g.name==='Breakaway' || g.cls==='chase' || g.members.length <= 9);
    const tag = r => showRoles ? `${r.name} <span style="opacity:.7">(${r.role})</span>` : r.name;
    const shown = [];
    mineIn.forEach(r => shown.push(`<span class="mine">${r.emoji} ${r.name} (${r.role})</span>`));
    const room = Math.max(0, 8 - mineIn.length);
    others.slice(0, room).forEach(r => shown.push(tag(r)));
    const more = others.length - room;
    const memberTxt = shown.join(', ') + (more>0 ? ` <span style="opacity:.7">+${more} more</span>` : '');
    const kmToGo = (R.distTotal - g.avgDist);
    const ids = mineIn.map(r=>r.id).join(',');

    const orderBlock = mineIn.length ? `
      <div class="grpctl-orders">
        <span class="lbl">ORDER THESE ${mineIn.length} RIDER${mineIn.length>1?'S':''}:</span>
        ${['relax','follow','pull','attack'].map(k=>
          `<button data-act="gorder" data-id="${ids}" data-arg="${k}">${ORDER_BY_KEY[k].label}</button>`).join('')}
      </div>
      ${mineIn.map(r=>riderCtlHtml(r, R)).join('')}` : '';

    return `<div class="grpctl ${g.cls}">
      <div class="grpctl-head">
        <span class="grpctl-name" id="gh-${i}">${g.name} (${g.members.length})${mineIn.length?' \u00b7 '+mineIn.length+' of yours':''}</span>
        <span class="grpctl-gap" id="gg-${i}">${g.gap<1?'LEADING':fmtGap(g.gap)} \u00b7 ${kmToGo.toFixed(1)}km</span>
      </div>
      <div class="grp-mem" id="gm-${i}">${memberTxt}</div>
      ${orderBlock}
    </div>`;
  }).join('') + (function(){
    const fin = R.riders.filter(r=>r.mine && r.finished);
    return fin.length ? `<div class="grpctl"><div class="grpctl-head">
      <span class="grpctl-name">FINISHED</span></div>
      <div class="grp-mem">${fin.map(r=>r.emoji+' '+r.name).join(', ')}</div></div>` : '';
  })();
}

/* Between rebuilds, refresh the group headings in place so gaps stay live
   without destroying the order buttons mid-click. */
const GOAL_TEXT = {
  sprint:'setting up a bunch sprint \u2014 chasing the break down',
  gc:'protecting their GC leader \u2014 refusing to chase',
  break:'trying to put a man up the road',
  tt:'riding for the best time they can',
};
function rivalIntentionsHtml(){
  const R = G.race;
  if(!R || !R.teamGoals) return '';
  return Object.keys(R.teamGoals).map(tm => {
    const goal = R.teamGoals[tm];
    const boss = R.riders.find(r=>r.team===tm && r.isTeamBoss);
    return `<div class="group-line" style="margin-bottom:4px;">
      <span style="color:var(--gold);">${tm}</span>
      <span class="flavor"> \u2014 ${GOAL_TEXT[goal]||''}${boss?' (for '+boss.name+')':''}</span></div>`;
  }).join('');
}

function updateMergedHeaders(){
  const R = G.race;
  R.groups.forEach((g,i) => {
    const mineIn = g.members.filter(r=>r.mine && !r.finished).length;
    const h = document.getElementById('gh-'+i);
    if(h) h.textContent = g.name+' ('+g.members.length+')'+(mineIn?' \u00b7 '+mineIn+' of yours':'');
    const gp = document.getElementById('gg-'+i);
    if(gp) gp.textContent = (g.gap<1?'LEADING':fmtGap(g.gap))+' \u00b7 '+(R.distTotal-g.avgDist).toFixed(1)+'km';
  });
}

/* ---- running order: drag riders to set the lead-out train ---- */
function ensureTeamOrder(){
  const R = G.race; if(!R) return [];
  if(!R.teamOrder) R.teamOrder = R.riders.filter(r=>r.mine).map(r=>r.id);
  return R.teamOrder;
}
/* ------------------------------------------------------------------
   Every in-race control is dispatched from ONE listener on document.
   Inline on* attributes were being lost whenever the live panel
   redrew; a delegated listener cannot be detached by a redraw.
   ------------------------------------------------------------------ */
let DELEGATED = false;
function initDelegation(){
  if(DELEGATED || typeof document === 'undefined' || !document.addEventListener) return;
  DELEGATED = true;
  document.addEventListener('mousedown', onDelegate, true);
  document.addEventListener('touchstart', onDelegate, true);
}
function onDelegate(e){
  const el = e && e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  const act = el.getAttribute('data-act');
  const id  = el.getAttribute('data-id');
  const arg = el.getAttribute('data-arg');
  if(e.preventDefault) e.preventDefault();
  if(e.stopPropagation) e.stopPropagation();
  switch(act){
    case 'order':    setOrder(id, arg); break;
    case 'gorder':   setGroupOrders(id, arg); break;
    case 'allorder': setAllOrders(arg); break;
    case 'leader':   setGcLeader(id); break;
    case 'solo':     launchAttack(id); break;
    case 'zone':     setTTZone(id, arg); break;
    case 'allzone':  setAllZones(arg); break;
    case 'run':      toggleRun(); break;
    case 'speed':    setSpeedMult(parseInt(arg,10)); break;
    case 'sim':      simulateToFinish(); break;
    case 'vgc':      toggleVirtualGC(); break;
    case 'buy':      buyRider(id, parseInt(arg,10)); break;
    case 'sell':     sellRider(id); break;
    case 'scout':    scoutMarket(); break;
  }
}

function repaintOrders(){
  const R = G.race; if(!R) return;
  R._teamSig = null;
  R._lastPanelBuild = Date.now();
  R._lockUntil = Date.now() + 1600;     // keep the auto-refresh off it for a moment
  const el = document.getElementById('raceBox');
  if(el) el.innerHTML = mergedRaceHtml();
}
function lockPanel(){ if(G.race) G.race._lockUntil = Date.now() + 1600; }

/* ---- pointer-based drag: works with a mouse or a finger, and does not
       depend on HTML5 drag-and-drop, which the live panel kept cancelling ---- */
let DRAG = {id:null, over:null};
function ptFrom(ev){
  const t = (ev.touches && ev.touches[0]) || (ev.changedTouches && ev.changedTouches[0]);
  return {x: t ? t.clientX : ev.clientX, y: t ? t.clientY : ev.clientY};
}
function clearDropMarks(){
  const nodes = document.querySelectorAll ? document.querySelectorAll('.rctl, .ts-row') : [];
  for(let i=0;i<nodes.length;i++){
    nodes[i].classList.remove('drop-target');
    nodes[i].classList.remove('dragging');
  }
}
function orderDragStart(ev, id){
  const R = G.race; if(!R) return;
  if(ev && ev.preventDefault) ev.preventDefault();
  DRAG.id = id; DRAG.over = null;
  R._dragging = true;
  const me = document.getElementById('rctl-'+id);
  if(me) me.classList.add('dragging');
  const strip = document.getElementById('ts-'+id);
  if(strip) strip.classList.add('dragging');
  document.addEventListener('mousemove', orderDragMove);
  document.addEventListener('mouseup', orderDragEnd);
  document.addEventListener('touchmove', orderDragMove, {passive:false});
  document.addEventListener('touchend', orderDragEnd);
}
function orderDragMove(ev){
  if(!DRAG.id) return;
  if(ev && ev.preventDefault) ev.preventDefault();
  const p = ptFrom(ev);
  const el = document.elementFromPoint ? document.elementFromPoint(p.x, p.y) : null;
  const card = el && el.closest ? (el.closest('.ts-row') || el.closest('.rctl')) : null;
  const nodes = document.querySelectorAll ? document.querySelectorAll('.rctl, .ts-row') : [];
  for(let i=0;i<nodes.length;i++) nodes[i].classList.remove('drop-target');
  const overId = card && card.id ? card.id.replace('ts-','').replace('rctl-','') : null;
  if(overId && overId !== DRAG.id){
    card.classList.add('drop-target');
    DRAG.over = overId;
  } else {
    DRAG.over = null;
  }
}
function orderDragEnd(){
  document.removeEventListener('mousemove', orderDragMove);
  document.removeEventListener('mouseup', orderDragEnd);
  document.removeEventListener('touchmove', orderDragMove);
  document.removeEventListener('touchend', orderDragEnd);
  const src = DRAG.id, dst = DRAG.over;
  DRAG.id = null; DRAG.over = null;
  clearDropMarks();
  if(G.race) G.race._dragging = false;
  if(src && dst && src !== dst) placeBefore(src, dst);
  repaintOrders();
}
/* put one rider immediately ahead of another in the running order */
function placeBefore(srcId, dstId){
  const list = ensureTeamOrder();
  const from = list.indexOf(srcId);
  if(from < 0) return;
  list.splice(from, 1);
  const to = list.indexOf(dstId);
  list.splice(to < 0 ? list.length : to, 0, srcId);
}

/* Move a rider up or down the running order, relative to his group-mates. */
function moveInOrder(id, dir){
  const R = G.race; if(!R) return;
  lockPanel();
  const list = ensureTeamOrder();
  const me = R.riders.find(r=>r.id===id);
  if(!me) return;
  const g = R.groups[me.groupIdx];
  const mates = (g ? g.members.filter(m=>m.mine && !m.finished) : R.riders.filter(r=>r.mine && !r.finished))
                  .slice().sort((a,b)=> list.indexOf(a.id) - list.indexOf(b.id));
  const pos = mates.findIndex(m=>m.id===id);
  const swapWith = mates[pos + dir];
  if(pos < 0 || !swapWith) return;
  if(dir < 0){
    placeBefore(id, swapWith.id);
  } else {
    const i = list.indexOf(id);
    list.splice(i, 1);
    list.splice(list.indexOf(swapWith.id) + 1, 0, id);
  }
  repaintOrders();
}

function setGroupOrders(idList, key){
  const R = G.race; if(!R) return;
  idList.split(',').forEach(id => {
    const r = R.riders.find(x=>x.id===id);
    if(r && !r.finished) setOrd(r, key);
  });
  updateRaceUI();
}

function ttTeamHtml(){
  const R = G.race;
  const best = R.riders.slice().sort((a,b)=>b.dist-a.dist)[0];
  return R.riders.filter(r=>r.mine).map(r => {
    const nrg = Math.round(r.energy);
    const scale = (10000/Math.max(nrg,1)).toFixed(0);
    const done = (r.dist/R.distTotal*100);
    const proj = r.finished ? r.finishTime : R.t + (R.distTotal-r.dist)/Math.max(8,r.speed)*3600;
    // can he hold this to the line? compare energy left against distance left
    const kmLeft = Math.max(0, R.distTotal - r.dist);
    const burn = 0.33*Math.pow(Math.max(r.effort,25)/70,2.8)*(1-(r.stats.endurance-5)*0.055);
    const needed = burn*kmLeft;
    const verdict = r.finished ? 'FINISHED'
                  : (needed > r.energy+6 ? 'WILL BLOW UP' : (needed > r.energy-8 ? 'ON THE LIMIT' : 'SUSTAINABLE'));
    const vcol = verdict==='WILL BLOW UP' ? 'var(--polka)' : (verdict==='ON THE LIMIT' ? 'var(--yellow)' : 'var(--green)');
    const zoneRow = TT_ZONES.map(z =>
      `<button id="zn-${r.id}-${z.key}" class="${r.zone===z.key?'on':''} ${z.key==='max'?'mx':''}"
        data-act="zone" data-id="${r.id}" data-arg="${z.key}" title="${z.desc}">${z.label}</button>`).join('');
    return `<div class="rctl" id="rctl-${r.id}">
      <div class="rc-top">
        <span class="rc-name">${r.emoji} ${r.name}</span>
        <span class="rc-role">TT ${r.stats.tt}</span>
        <span class="rc-grp" id="rcgrp-${r.id}">${done.toFixed(0)}% \u00b7 ${r.speed.toFixed(1)} km/h</span>
      </div>
      <div class="rc-mid">
        <span class="rc-end">EST ${fmtTime(proj)}</span>
        <span class="rc-nrg"><i id="rcnrg-${r.id}" style="width:${nrg}%; background-size:${scale}% 100%;"></i></span>
        <span class="rc-pct" id="rcpct-${r.id}">${nrg}%</span>
        <span id="rcst-${r.id}" style="color:${vcol};font-size:11px;">${verdict}</span>
      </div>
      <div class="rc-eff" id="rceff-${r.id}">${zoneRow}</div>
    </div>`;
  }).join('');
}

function ttStandingsHtml(){
  const R = G.race;
  const rows = R.riders.map(r => ({
    r, proj: r.finished ? r.finishTime : R.t + (R.distTotal-r.dist)/Math.max(8,r.speed)*3600
  })).sort((a,b)=>a.proj-b.proj).slice(0,10);
  const best = rows.length?rows[0].proj:0;
  return `<table class="table"><thead><tr><th>#</th><th>Rider</th><th>Status</th><th>Time</th></tr></thead><tbody>` +
    rows.map((o,i)=>`<tr class="${o.r.mine?'you':''}"><td class="rank">${i+1}</td><td>${o.r.name}</td>
      <td style="color:var(--muted);font-size:13px;">${o.r.finished?'finished':(o.r.dist/R.distTotal*100).toFixed(0)+'%'}</td>
      <td>${i===0?fmtTime(o.proj):fmtGap(o.proj-best)}</td></tr>`).join('') +
    `</tbody></table><div class="flavor" style="margin-top:4px;">Riders still on course show a projected finishing time.</div>`;
}

function virtualGcHtml(){
  const R = G.race;
  const all = virtualGC(R);
  const lead = all.length?all[0].total:0;
  const boss = gcLeader(R);
  const rows = all.slice(0,10);
  const bossIdx = boss ? all.findIndex(o=>o.id===boss.id) : -1;
  let bossLine = '';
  if(boss && bossIdx >= 0){
    const o = all[bossIdx];
    bossLine = `<div class="gcboss">Your GC rider <strong>${boss.emoji} ${boss.name}</strong> is
      <strong style="color:var(--yellow)">${bossIdx===0?'in the virtual lead':bossIdx+1+getOrdinal(bossIdx+1)+' overall'}</strong>
      ${bossIdx===0?'':', '+fmtGap(o.total-lead)+' down'}
      \u2014 he is <strong>${o.stageGap<2?'in the leading group on the road':fmtGap(o.stageGap)+' behind on the road'}</strong>.</div>`;
  }
  const inTop = rows.some(o=>boss && o.id===boss.id);
  const extra = (!inTop && bossIdx>=0)
    ? `<tr class="you"><td class="rank">${bossIdx+1}</td><td>${all[bossIdx].name}</td>
       <td style="font-size:13px;color:var(--muted);">${all[bossIdx].team}</td>
       <td>${fmtGap(all[bossIdx].total-lead)}</td></tr>` : '';
  return bossLine + `<table class="table"><thead><tr><th>#</th><th>Rider</th><th>Team</th><th>Gap</th></tr></thead><tbody>` +
    rows.map((o,i)=>`<tr class="${o.mine?'you':''}"><td class="rank">${i+1}</td>
      <td>${boss&&o.id===boss.id?'\u2605 ':''}${o.name}</td>
      <td style="font-size:13px;color:var(--muted);">${o.team}</td>
      <td>${i===0?'LEADER':fmtGap(o.total-lead)}</td></tr>`).join('') + extra +
    `</tbody></table>
    <div class="flavor" style="margin-top:4px;">Accumulated race time plus the gap each rider currently holds on the road.</div>`;
}
function getOrdinal(n){
  const s=['th','st','nd','rd'], v=n%100;
  return (s[(v-20)%10]||s[v]||s[0]);
}

/* Update the rider rows IN PLACE. Rewriting this panel's HTML on every tick
   destroyed the buttons mid-click, so orders were being swallowed. */
function updateTeamRows(){
  const R = G.race;
  if(!R) return;
  const isTT = R.type === 'tt';
  R.riders.filter(r=>r.mine).forEach(r => {
    const nrg = Math.round(r.energy);
    const fill = document.getElementById('rcnrg-'+r.id);
    if(fill){
      fill.style.width = nrg + '%';
      fill.style.backgroundSize = (10000/Math.max(nrg,1)).toFixed(0) + '% 100%';
    }
    const pct = document.getElementById('rcpct-'+r.id);
    if(pct) pct.textContent = nrg + '%';
    const grp = document.getElementById('rcgrp-'+r.id);
    if(grp){
      grp.textContent = isTT
        ? (r.dist/R.distTotal*100).toFixed(0)+'% \u00b7 '+r.speed.toFixed(1)+' km/h'
        : (r.finished ? '\u2014' : r.groupName);
    }
    const st = document.getElementById('rcst-'+r.id);
    if(st){
      if(isTT){
        const kmLeft = Math.max(0, R.distTotal - r.dist);
        const burn = 0.33*Math.pow(Math.max(r.effort,25)/70,2.8)*(1-(r.stats.endurance-5)*0.055);
        const needed = burn*kmLeft;
        const verdict = r.finished ? 'FINISHED'
                      : (needed > r.energy+6 ? 'WILL BLOW UP' : (needed > r.energy-8 ? 'ON THE LIMIT' : 'SUSTAINABLE'));
        st.style.color = verdict==='WILL BLOW UP' ? 'var(--polka)' : (verdict==='ON THE LIMIT' ? 'var(--yellow)' : 'var(--green)');
        st.style.fontSize = '11px';
        st.textContent = verdict;
      } else {
        st.innerHTML = r.finished ? '<span style="color:var(--green);font-size:12px;">FINISHED</span>'
                     : (r.cracked ? '<span class="cracked-tag">CRACKED</span>' : '');
      }
    }
    const card = document.getElementById('rctl-'+r.id);
    if(card && !isTT){
      const dropped = (r.groupName==='Dropped' || r.groupName==='Grupetto');
      card.className = 'rctl' + (dropped ? ' dropped' : '');
    }
    const effWrap = document.getElementById('rceff-'+r.id);
    if(effWrap) effWrap.style.display = r.finished ? 'none' : 'flex';
    if(isTT){
      TT_ZONES.forEach(z => {
        const b = document.getElementById('zn-'+r.id+'-'+z.key);
        if(b) b.className = (r.zone===z.key?'on':'') + (z.key==='max'?' mx':'');
      });
    } else {
      ORDERS.forEach(o => {
        const b = document.getElementById('ord-'+r.id+'-'+o.key);
        if(b) b.className = (r.order===o.key?'on':'') + (o.key==='attack'?' mx':'');
      });
    }
  });
}
