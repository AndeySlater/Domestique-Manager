<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOMESTIQUE — Grand Tour Season</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16305c; --panel:#1d3d75; --panel-light:#27508f; --panel-lighter:#3a66ad;
    --deep:#102murky; --deep:#0f2547;
    --red:#c0392b; --red-lt:#e0503f; --red-dk:#8e2a20;
    --yellow:#f4c430; --green:#6fcf47; --polka:#e6483f; --cream:#f2ead3;
    --muted:#9db3d6; --road:#2b4a80; --orange:#f2994a; --blue:#6ec8ff;
    --gold:#ffd24a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--cream); font-family:'VT323',monospace; font-size:20px;
    min-height:100vh; display:flex; justify-content:center;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.05) 0 2px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.04) 0 2px, transparent 2px);
    background-size: 46px 46px, 62px 62px;}
  #app{width:100%; max-width:1520px; min-height:100vh; background:var(--bg); display:flex;
    flex-direction:column; border-left:4px solid var(--deep); border-right:4px solid var(--deep);
    position:relative; overflow:hidden;}
  .pixel{font-family:'Press Start 2P',monospace;}
  h1,h2,h3{margin:0;}
  .topbar{background:var(--panel); border-bottom:2px solid var(--panel-lighter); padding:10px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .topbar .title{font-size:13px; color:var(--yellow); letter-spacing:1px;}
  .nav-btn{font-family:'VT323',monospace; font-size:14px; background:var(--panel-light); color:var(--muted);
    border:1px solid var(--panel-lighter); padding:5px 9px; cursor:pointer;}
  .nav-btn:hover{color:var(--yellow); border-color:var(--yellow);}
  .nav-btn.spacer{visibility:hidden;}
  .subbar{background:var(--panel-light); border-bottom:2px solid var(--panel-lighter); padding:6px 14px;
    font-size:15px; color:var(--muted);}
  .screen{padding:16px; flex:1; display:flex; flex-direction:column; gap:12px;}
  .btn{font-family:'VT323',monospace; font-size:20px; background:var(--panel-lighter); color:var(--cream);
    border:2px solid var(--cream); padding:10px 16px; cursor:pointer; text-align:left;
    transition:transform .06s ease, background .15s ease;}
  .btn:hover{background:var(--yellow); color:#1a1a1a; transform:translateX(2px);}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--yellow); color:#1a1a1a; border-color:var(--yellow); font-weight:bold;}
  .btn.primary:hover{background:#ffd75e;}
  .btn.block{width:100%;}
  .btn.small{font-size:16px; padding:6px 10px;}
  .btn:disabled{opacity:.4; cursor:not-allowed; background:var(--panel-lighter); color:var(--muted); transform:none;}
  .btn:disabled:hover{background:var(--panel-lighter); color:var(--muted);}
  .card{background:var(--panel); border:2px solid var(--panel-lighter); padding:12px;}
  .badge{display:inline-block; font-family:'Press Start 2P',monospace; font-size:9px; padding:4px 7px;
    border:2px solid currentColor; letter-spacing:1px;}
  .badge.flat{color:#6fcf47;} .badge.hilly{color:#f4c430;} .badge.mountain{color:#e6483f;}
  .badge.tt{color:#4dd2ff;} .badge.cobbles{color:#c9a227;} .badge.uphill{color:#f2994a;}
  .badge.medium{color:#e08f5a;} .badge.locked{color:var(--muted);} .badge.done{color:var(--green);}
  .badge.current{color:var(--yellow);}
  .tab-row{display:flex; gap:4px; border-bottom:2px solid var(--panel-lighter);}
  .tab-btn{font-family:'VT323',monospace; font-size:17px; background:var(--panel); color:var(--muted);
    border:2px solid var(--panel-lighter); border-bottom:none; padding:8px 14px; cursor:pointer;}
  .tab-btn.active{background:var(--panel-lighter); color:var(--yellow);}
  .rider-card{background:var(--panel); border:2px solid var(--panel-lighter); padding:10px 12px;
    display:flex; flex-direction:column; gap:6px;}
  .rider-head{display:flex; justify-content:space-between; align-items:baseline;}
  .rider-name{font-size:20px; color:var(--cream);}
  .rider-role{font-size:14px; color:var(--muted);}
  .stat-row{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted);}
  .stat-label{width:74px;}
  .attr-pip-row{flex:1; display:flex; gap:2px;}
  .attr-pip{flex:1; height:11px; background:#0f1128; border:1px solid var(--panel-lighter);}
  .cond-bar-bg{flex:1; height:10px; background:#0f1128; border:1px solid var(--panel-lighter);}
  .cond-bar-fill{height:100%;}
  .cond-pip-row{flex:1; display:flex; gap:0; border:1px solid var(--panel-lighter); background:#0f1128;}
  .cond-pip{flex:1 1 0; height:12px; min-width:0;}
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:2px 14px;}
  .stars{color:var(--yellow); font-size:16px; letter-spacing:1px;}
  .stars.potential{color:var(--green);}
  .legend{font-size:14px; color:var(--muted); line-height:1.6; display:flex; flex-direction:column; gap:2px;}
  .levelup-box{background:#2a1f0f; border:2px solid var(--orange); padding:8px; display:flex; flex-direction:column; gap:6px;}
  .levelup-box .lbl{color:var(--orange); font-size:14px;}
  .levelup-opts{display:flex; flex-wrap:wrap; gap:4px;}
  .levelup-opts button{font-family:'VT323'; font-size:14px; background:var(--panel-lighter); color:var(--cream);
    border:1px solid var(--orange); padding:4px 8px; cursor:pointer;}
  .levelup-opts button:hover{background:var(--orange); color:#1a1a1a;}
  .stage-banner{background:linear-gradient(135deg,var(--panel-light),var(--panel));
    border:2px solid var(--panel-lighter); padding:14px;}
  .stage-banner h2{font-size:20px; color:var(--yellow); margin-bottom:6px;}
  .stage-banner .desc{color:var(--muted); font-size:16px; margin-top:6px;}
  .rider-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* ---- RACE ---- */
  .race-meta{display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:var(--panel); border:2px solid var(--panel-lighter); padding:8px 12px;
    font-family:'Press Start 2P',monospace; font-size:11px;}
  .race-meta .kmleft{color:var(--yellow);}
  .race-ctrl{display:flex; gap:6px; flex-wrap:wrap;}
  .ctrl-dock{position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; justify-content:center;
    pointer-events:none;}
  .ctrl-dock .inner{width:100%; max-width:1520px; background:var(--deep); border-top:4px solid var(--panel-lighter);
    padding:8px 14px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; pointer-events:auto;
    box-shadow:0 -6px 18px rgba(0,0,0,.45);}
  .ctrl-dock .ctrl-btn{font-size:17px; padding:7px 14px;}
  .ctrl-dock .kmtag{margin-left:auto; font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold);}
  .race-pad{height:64px;}
  /* live finish feed */
  .finishbox{background:var(--panel); border:3px solid var(--gold); padding:10px; margin-bottom:12px;}
  .finishbox h3{font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold); letter-spacing:2px; margin-bottom:8px;}
  .finrow{display:flex; align-items:center; gap:9px; padding:5px 6px; border-bottom:1px solid var(--panel-lighter);
    font-size:17px; animation:popin .35s ease;}
  .finrow.mine{background:rgba(244,196,48,.14); color:var(--gold);}
  .finrow .pos{font-family:'Press Start 2P',monospace; font-size:12px; width:26px; color:var(--muted);}
  .finrow.win .pos{color:var(--gold);}
  .finrow .tm{margin-left:auto; color:var(--muted); font-size:15px;}
  @keyframes popin{from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:none;}}
  .winbanner{background:var(--gold); color:#1a1a1a; border:3px solid var(--deep); padding:9px 12px;
    font-family:'Press Start 2P',monospace; font-size:12px; letter-spacing:1px; margin-bottom:10px;}
  .ctrl-btn{font-family:'VT323',monospace; font-size:16px; background:var(--panel-lighter); color:var(--cream);
    border:1px solid var(--panel-lighter); padding:4px 10px; cursor:pointer;}
  .ctrl-btn:hover{border-color:var(--yellow); color:var(--yellow);}
  .ctrl-btn.on{background:var(--yellow); color:#1a1a1a; border-color:var(--yellow);}
  .profile-box{background:var(--panel); border:2px solid var(--panel-lighter); padding:6px;}
  .profile-head{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:0 2px 4px;}
  .grouplist{display:flex; flex-direction:column; gap:8px;}
  .grp{border-left:4px solid var(--panel-lighter); padding:6px 10px; background:var(--panel-light);}
  .grp.break{border-left-color:var(--orange);}
  .grp.peloton{border-left-color:var(--blue);}
  .grp.chase{border-left-color:var(--yellow);}
  .grp.dropped{border-left-color:var(--polka);}
  .grp-head{display:flex; justify-content:space-between; align-items:baseline; font-size:16px;}
  .grp-name{color:var(--cream); letter-spacing:1px;}
  .grp-gap{color:var(--yellow); font-family:'Press Start 2P',monospace; font-size:10px;}
  .grp-mem{font-size:14px; color:var(--muted); margin-top:3px; line-height:1.4;}
  .grp-mem .mine{color:var(--yellow); font-weight:bold;}
  .trow{display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid var(--panel-lighter);
    flex-wrap:wrap;}
  .trow .t-emoji{width:16px; font-size:14px;}
  .trow .t-name{width:104px; color:var(--cream); font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .trow .t-role{width:60px; color:var(--muted); font-size:10px; text-transform:uppercase;}
  .trow .t-end{width:40px; color:var(--muted); font-size:11px;}
  .trow .t-grp{width:56px; font-size:11px; color:var(--blue);}
  .trow .t-nrg{width:64px; height:9px; background:#0f1128; border:1px solid var(--panel-lighter);}
  .trow .t-nrg i{display:block; height:100%;}
  .trow .t-pct{width:34px; font-size:11px; color:var(--muted); text-align:right;}
  .eff-row{display:flex; gap:2px;}
  .eff-btn{font-family:'VT323',monospace; font-size:11px; background:#0f1128; color:var(--muted);
    border:1px solid var(--panel-lighter); padding:2px 5px; cursor:pointer;}
  .eff-btn:hover{color:var(--yellow); border-color:var(--yellow);}
  .eff-btn.on{background:var(--yellow); color:#1a1a1a; border-color:var(--yellow); font-weight:bold;}
  .eff-btn.max.on{background:var(--polka); border-color:var(--polka); color:#fff;}
  .cracked-tag{color:var(--polka); font-size:11px;}
  .evt-box{background:#0f1128; border:2px solid var(--panel-lighter); padding:8px 10px; font-size:15px;
    color:var(--muted); line-height:1.5; min-height:60px;}
  .evt-box .new{color:var(--cream);}
  .quickset{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--muted);}

  .table{width:100%; border-collapse:collapse; font-size:17px;}
  .table th,.table td{text-align:left; padding:5px 6px; border-bottom:1px solid var(--panel-lighter);}
  .table th{color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:1px;}
  .table tr.you td{color:var(--yellow); font-weight:bold;}
  .table td.rank{width:30px; color:var(--muted);}
  .jersey-row{display:flex; gap:8px; flex-wrap:wrap;}
  .jersey-chip{display:flex; align-items:center; gap:6px; padding:6px 10px;
    border:2px solid var(--panel-lighter); background:var(--panel); font-size:14px;}
  .dot{width:12px; height:12px; border-radius:50%; display:inline-block; border:2px solid #1a1a1a;}
  .flavor{color:var(--muted); font-size:15px; line-height:1.4;}
  .title-screen{align-items:center; justify-content:center; text-align:center; gap:20px; flex:1;}
  .title-screen .pixel{font-size:24px; color:var(--yellow); line-height:1.6;}
  .title-screen .pixel.small{font-size:12px; color:var(--muted);}
  footer.hint{font-size:13px; color:var(--muted); text-align:center; padding:10px;}
  .staff-row{display:flex; flex-direction:column; gap:4px; padding:10px 0; border-bottom:1px solid var(--panel-lighter);}
  .staff-name{color:var(--cream); font-size:18px;}
  .staff-desc{color:var(--muted); font-size:14px;}
  .staff-level-bar{display:flex; gap:2px; margin:4px 0;}
  .staff-pip{width:16px; height:12px; background:#0f1128; border:1px solid var(--panel-lighter);}
  .staff-pip.filled{background:var(--yellow);}
  .locked-panel{background:var(--panel); border:2px dashed var(--panel-lighter); padding:18px;
    text-align:center; color:var(--muted);}
  /* decision modal */
  .modal-wrap{position:fixed; inset:0; background:rgba(8,9,20,.82); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:var(--panel); border:3px solid var(--yellow); max-width:560px; width:100%;
    padding:16px; display:flex; flex-direction:column; gap:10px; max-height:88vh; overflow:auto;}
  .modal h3{color:var(--yellow); font-family:'Press Start 2P',monospace; font-size:12px; line-height:1.6;}
  .modal .mtext{font-size:18px; color:var(--cream); line-height:1.4;}
  .modal .mkm{font-size:13px; color:var(--muted); letter-spacing:1px;}
  .opt{font-family:'VT323',monospace; font-size:19px; background:var(--panel-lighter); color:var(--cream);
    border:2px solid var(--cream); padding:9px 12px; cursor:pointer; text-align:left;}
  .opt:hover{background:var(--yellow); color:#1a1a1a;}
  .opt .od{display:block; font-size:14px; color:var(--muted); margin-top:2px;}
  .opt:hover .od{color:#3a3a1a;}
  /* per-rider control card */
  .rctl{background:var(--panel-light); border:1px solid var(--panel-lighter); padding:7px 9px; margin-bottom:6px;}
  .rctl.dropped{border-color:var(--polka);}
  .rc-top{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .rc-name{color:var(--cream); font-size:17px; flex:1; min-width:110px;}
  .rc-role{color:var(--blue); font-size:12px; text-transform:uppercase; letter-spacing:1px;}
  .rc-grp{font-size:12px; color:var(--muted);}
  .rc-mid{display:flex; align-items:center; gap:6px; margin:4px 0;}
  .rc-nrg{flex:1; height:10px; background:#0f1128; border:1px solid var(--panel-lighter);}
  .rc-nrg i{display:block; height:100%; background-image:linear-gradient(90deg,#e6483f,#f4c430,#6fcf47);}
  .rc-pct{width:34px; font-size:13px; color:var(--muted); text-align:right;}
  .rc-end{font-size:12px; color:var(--muted);}
  .rc-eff{display:flex; gap:3px; align-items:center;}
  .rc-eff .lbl{font-size:11px; color:var(--muted); letter-spacing:1px; margin-right:2px;}
  .rc-eff button{flex:1; font-family:'VT323',monospace; font-size:14px; background:#0f1128;
    color:var(--muted); border:1px solid var(--panel-lighter); padding:5px 2px; cursor:pointer;}
  .rc-eff button:hover{color:var(--yellow); border-color:var(--yellow);}
  .rc-eff button.on{background:var(--yellow); color:#1a1a1a; border-color:var(--yellow); font-weight:bold;}
  .rc-eff button.on.mx{background:var(--polka); border-color:var(--polka); color:#fff;}
  .grpctl{border:2px solid var(--panel-lighter); border-left-width:5px; margin-bottom:10px; padding:8px;}
  .grpctl.break{border-left-color:var(--orange);}
  .grpctl.peloton{border-left-color:var(--blue);}
  .grpctl.chase{border-left-color:var(--yellow);}
  .grpctl.dropped{border-left-color:var(--polka);}
  .grpctl-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; flex-wrap:wrap;}
  .grpctl-name{color:var(--cream); font-size:15px; letter-spacing:1px;}
  .grpctl-gap{color:var(--yellow); font-family:'Press Start 2P',monospace; font-size:9px;}
  .grpctl-orders{display:flex; gap:3px; align-items:center; margin-bottom:6px; flex-wrap:wrap;}
  .grpctl-orders .lbl{font-size:11px; color:var(--muted); letter-spacing:1px;}
  .grpctl-orders button{font-family:'VT323',monospace; font-size:12px; background:var(--panel);
    color:var(--muted); border:1px solid var(--panel-lighter); padding:3px 7px; cursor:pointer;}
  .grpctl-orders button:hover{color:var(--yellow); border-color:var(--yellow);}
  .lead-btn{font-family:'VT323',monospace; font-size:13px; background:#0f1128; color:var(--muted);
    border:1px solid var(--panel-lighter); padding:1px 6px; cursor:pointer; margin-right:2px;}
  .lead-btn:hover{color:var(--yellow); border-color:var(--yellow);}
  .lead-btn.on{background:var(--yellow); color:#1a1a1a; border-color:var(--yellow);}
  .ordhandle{font-family:'Press Start 2P',monospace; font-size:9px; color:var(--muted); cursor:grab; letter-spacing:1px;}
  .matetag{font-size:12px; color:var(--green);}
  .ordbtns{display:flex; gap:2px;}
  .ordbtns button{font-family:'VT323',monospace; font-size:11px; background:#0f1128; color:var(--muted);
    border:1px solid var(--panel-lighter); padding:0 5px; cursor:pointer; line-height:16px;}
  .ordbtns button:hover{color:var(--gold); border-color:var(--gold);}
  .rctl.dragging{opacity:.55; border-color:var(--gold);}
  .rctl.drop-target{border-color:var(--gold); box-shadow:0 -3px 0 var(--gold) inset;}
  .ordhandle{touch-action:none; user-select:none; padding:2px 4px;}
  .ordhandle:active{cursor:grabbing;}
  .trainhint{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.35;}
  .trainstrip{background:var(--deep); border:2px solid var(--panel-lighter); padding:7px; margin-bottom:8px;}
  .ts-title{font-family:'Press Start 2P',monospace; font-size:8px; color:var(--gold); letter-spacing:1px; margin-bottom:6px;}
  .ts-row{display:flex; align-items:center; gap:7px; padding:4px 5px; background:var(--panel-light);
    border:2px solid var(--deep); margin-bottom:4px;}
  .ts-row.drop-target{border-color:var(--gold);}
  .ts-row.dragging{opacity:.5;}
  .ts-pos{font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold); width:16px;}
  .ts-grip{cursor:grab; color:var(--muted); font-size:15px; touch-action:none; user-select:none; padding:0 3px;}
  .ts-name{flex:1; color:#fff; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ts-role{font-size:11px; color:var(--muted); text-transform:uppercase;}
  .ts-btn{font-family:'VT323',monospace; font-size:15px; background:#0f1128; color:var(--cream);
    border:2px solid var(--panel-lighter); padding:1px 9px; cursor:pointer;}
  .ts-btn:hover{border-color:var(--gold); color:var(--gold);}
  .ts-btn:disabled{opacity:.3; cursor:default;}
  .gcboss{font-size:15px; color:var(--muted); line-height:1.45; margin-bottom:6px;}
  .battle-h{color:var(--yellow); font-size:16px; margin-bottom:6px;}
  .battle-sub{font-size:12px; color:var(--muted); letter-spacing:1px; margin-bottom:6px;}
  .solo-btn{font-family:'VT323',monospace; font-size:11px; background:#0f1128; color:var(--orange);
    border:1px solid var(--orange); padding:3px 6px; cursor:pointer; letter-spacing:1px;}
  .solo-btn:hover{background:var(--orange); color:#1a1a1a;}
  .gt-row{display:flex; justify-content:space-between; align-items:center; padding:10px 12px;
    background:var(--panel); border:2px solid var(--panel-lighter); margin-bottom:6px;}

  /* ---------- Retro-Goal style shell ---------- */
  .banner{background:linear-gradient(90deg,var(--red) 0%,var(--red) 62%,var(--red-dk) 100%);
    border-bottom:4px solid var(--deep); padding:10px 14px; display:flex; align-items:center; gap:12px;
    position:relative; overflow:hidden;}
  .banner:after{content:''; position:absolute; right:120px; top:0; bottom:0; width:180px;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 10px, transparent 10px 20px);}
  .banner .logo{width:34px; height:34px; border-radius:50%; background:var(--cream);
    border:3px solid var(--deep); display:flex; align-items:center; justify-content:center;
    font-size:17px; flex-shrink:0;}
  .banner h1{font-family:'Press Start 2P',monospace; font-size:17px; color:#fff; letter-spacing:2px;
    text-shadow:2px 2px 0 var(--red-dk); z-index:1;}
  .banner .sub2{font-family:'Press Start 2P',monospace; font-size:10px; color:#ffd9d2; letter-spacing:2px; z-index:1;}
  .coins{margin-left:auto; z-index:2; background:var(--red-dk); border:3px solid var(--deep);
    padding:4px 10px; display:flex; align-items:center; gap:6px;
    font-family:'Press Start 2P',monospace; font-size:11px; color:#fff;}
  .coin-ico{width:14px; height:14px; border-radius:50%; background:var(--gold); border:2px solid #8a6b12;}
  .navrow{display:flex; gap:6px; padding:10px 14px; background:var(--deep); border-top:4px solid var(--panel-lighter);}
  .navbtn{flex:1; font-family:'Press Start 2P',monospace; font-size:12px; background:var(--red);

/* pavé sectors, as percentage ranges of the stage */
const COBBLE_SECTORS = [[11,15],[23,27],[35,39],[49,53],[61,65],[73,77],[86,90]];
function inCobbles(type, xPct){
  if(type !== 'cobbles') return false;
  return COBBLE_SECTORS.some(sec => xPct >= sec[0] && xPct <= sec[1]);
}

const GRAND_TOURS_RAW = [

const ELEVATION = {};
const CLIMBS = {};
(function buildRoutes(){
  GRAND_TOURS.forEach(gt => gt.stages.forEach(st => {
    const shape = STAGE_SHAPES[st.key];
    if(!shape) return;
    const totalKm = shape.segs.reduce((a,sg)=>a+sg[1],0);
    const scale = st.dist / totalKm;          // stretch the shape to the real stage length
    const pts = [], climbs = [];
    let km = 0, y = shape.base;
    pts.push([0, Math.round(y)]);
    const push = () => pts.push([+(km/st.dist*100).toFixed(2), Math.round(y)]);
    shape.segs.forEach(sg => {
      const kind = sg[0], lenKm = sg[1]*scale;
      // sampled roughly every kilometre (every ~400 m on climbs) so the drawn
      // profile has real relief instead of a handful of straight lines
      if(kind === 'flat'){
        const steps = Math.max(3, Math.round(lenKm/1.6));
        for(let i=1;i<=steps;i++){
          km += lenKm/steps;
          y += Math.sin(i*1.7)*4.5 + Math.sin(i*0.53)*7 + (Math.random()-0.5)*2.5;
          push();
        }
      } else if(kind === 'roll'){
        const amp = (sg[2]||30);
        const humps = Math.max(1, Math.round(lenKm/(sg[3]?lenKm:7)));
        for(let i=1;i<=humps;i++){
          const startKm = km;
          const up = Math.max(3, Math.round(lenKm/humps*0.55/1.1));
          for(let j=1;j<=up;j++){ km += (lenKm/humps*0.55)/up; y += (amp/up)*(0.8+0.4*(j/up)); push(); }
          const dn = Math.max(3, Math.round(lenKm/humps*0.45/1.1));
          for(let j=1;j<=dn;j++){ km += (lenKm/humps*0.45)/dn; y -= (amp*0.8)/dn; push(); }
          if(sg[3] && i===1) climbs.push({s:startKm/st.dist*100, e:km/st.dist*100, name:sg[3], cat:sg[4]||'4'});
        }
      } else if(kind === 'climb'){
        const gain = sg[2], startKm = km;
        const steps = Math.max(8, Math.round(lenKm/0.4));
        for(let i=1;i<=steps;i++){
          const t = i/steps;
          // ramps and false flats on the way up, steepening near the summit
          const w = (0.80 + 0.34*t) * (1 + 0.30*Math.sin(t*9.1) + 0.16*Math.sin(t*21));
          km += lenKm/steps; y += (gain/steps)*w; push();
        }
        if(sg[3]) climbs.push({s:startKm/st.dist*100, e:km/st.dist*100, name:sg[3], cat:sg[4]||'2'});
      } else if(kind === 'desc'){
        const drop = sg[2] || 400;
        const steps = Math.max(8, Math.round(lenKm/0.6));
        for(let i=1;i<=steps;i++){
          const t = i/steps;
          km += lenKm/steps;
          y -= (drop/steps)*(1 + 0.25*Math.sin(t*7.3));
          push();
        }
      }
    });
    if(pts[pts.length-1][0] < 100) pts.push([100, Math.round(y)]);
    else pts[pts.length-1][0] = 100;
    ELEVATION[st.key] = pts;
    CLIMBS[st.key] = climbs.map(c=>({name:c.name, cat:c.cat, s:+c.s.toFixed(1), e:+c.e.toFixed(1)}));
  }));
})();

/* ===================== HELPERS ===================== */

function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi,v)); }
function lerp(a,b,t){ return a + (b-a)*clamp(t,0,1); }

function computeOvr(rider){
  const keys = OVR_WEIGHTS[rider.role];
  const avg = keys.reduce((s,k)=>s+rider.stats[k],0)/keys.length;
  return clamp(Math.round((avg/10*5)*2)/2, 0.5, 5);
}
/* A rider's potential is a ceiling, so it can never sit below what he
   already is. Anything the roster or development pushes past it lifts it. */
function potentialOf(r){ return Math.max(r.potential, computeOvr(r)); }
function starString(v){ const f=Math.floor(v); return '★'.repeat(f) + ((v-f)>=0.5?'½':''); }
/* Levelling is deliberately slow: each level costs more than the last,
   so a rider improves over seasons rather than over a single Grand Tour. */
function xpForLevel(L){ return 30*L*(L-1); }        // cumulative XP to reach level L
function levelOf(xp){
  let L = 1;
  while(xpForLevel(L+1) <= xp && L < 30) L++;
  return L;
}
function xpProgress(xp){
  const L = levelOf(xp), a = xpForLevel(L), b = xpForLevel(L+1);
  return {level:L, into:xp-a, need:b-a, pct:((xp-a)/(b-a))*100};
}
/* A rider can only develop as far as his potential allows. */
function statCap(rider, key){
  const byPotential = Math.round(2 + potentialOf(rider)*1.6);
  const already = key ? (rider.stats[key]||0) : 0;
  return clamp(Math.max(byPotential, already), 5, 10);
}
/* XP is earned by results, not by turning up. */
function xpForResult(rank, fieldSize){
  if(rank === 1) return 90;
  if(rank === 2) return 68;
  if(rank === 3) return 56;
  if(rank <= 5)  return 44;
  if(rank <= 10) return 30;
  if(rank <= 20) return 13;
  return 4;
}

/* ---------- AGE ----------
   Young riders improve quickly and are worth a premium; riders past 30 decline
   and lose value fast. This is what makes the transfer market a real decision. */
function ageBracket(age){
  if(age <= 22) return 'prospect';
  if(age <= 26) return 'rising';
  if(age <= 29) return 'peak';
  if(age <= 32) return 'veteran';
  return 'ageing';
}
const AGE_VALUE_MULT = {prospect:1.40, rising:1.22, peak:1.00, veteran:0.68, ageing:0.42};
const AGE_XP_MULT    = {prospect:1.40, rising:1.15, peak:0.95, veteran:0.70, ageing:0.50};

/* ---------- MARKET VALUE ----------
   Driven by what a rider IS (overall), what he might become (potential minus
   overall), and his age — then moved by how he actually performs for you. */
function marketValue(rider){
  const ovr = computeOvr(rider), pot = potentialOf(rider);
  let base = Math.pow(ovr, 2.1) * 9;
  base += Math.max(0, pot - ovr) * 42;
  base *= AGE_VALUE_MULT[ageBracket(rider.age||27)];
  base *= (rider.valueMod || 1);
  return Math.max(12, Math.round(base));
}
/* A transfer buys a contract: the longer you tie him down, the more it costs. */
function transferFee(rider, years){ return Math.round(marketValue(rider) * (0.7 + 0.15*years)); }
function sellPrice(rider){ return Math.round(marketValue(rider) * 0.85); }
function valueTrend(rider){
  const m = rider.valueMod || 1;
  if(m > 1.06) return {dir:'up', txt:'\u25b2 rising'};
  if(m < 0.94) return {dir:'down', txt:'\u25bc falling'};
  return {dir:'flat', txt:'\u2014 steady'};
}

function salaryOf(rider){
  const ovr = computeOvr(rider);
  let lo,hi,t;
  if(rider.role==='Domestique'){ lo=400000; hi=1000000; t=(ovr-1)/3; }
  else if(rider.role==='All-Rounder'){ lo=100000; hi=350000; t=(rider.potential-1)/4; }
  else { lo=1500000; hi=5000000; t=(ovr-2)/3; }
  return Math.round(lerp(lo,hi,t)/10000)*10000;
}
function barColor(pct){ return pct>=66?'var(--green)':(pct>=33?'var(--yellow)':'var(--polka)'); }
function conditionColor(v){ return barColor(v); }
function conditionFactor(v){ return 0.88 + 0.12*(v/100); }

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtGap(sec){
  sec = Math.round(sec);
  if(sec<=0) return '—';
  const m=Math.floor(sec/60), s=sec%60;
  return '+'+(m>0? m+"'"+String(s).padStart(2,'0')+'"' : s+'"');
}
function awardXp(rider, amt){
  const before=levelOf(rider.xp);
  rider.xp += Math.round(amt);
  const after=levelOf(rider.xp);
  if(after>before) rider.pendingLevelUps += (after-before);
}

const RACE_OUT = ['a broken collarbone', 'a deep gash needing stitches', 'concussion',
                  'a cracked rib', 'heat exhaustion'];
const SEASON_OUT = ['a fractured femur', 'a shattered wrist', 'a broken pelvis',
                    'a serious knee injury'];
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }

function riderAvailable(r){ return !(r.injury && r.injury.out); }
function injuryLabel(r){
  if(!r.injury) return '';
  const i = r.injury;
  if(i.out === 'season') return 'OUT FOR THE SEASON \u2014 ' + i.name;
  if(i.out === 'race')   return 'OUT OF THIS RACE \u2014 ' + i.name;
  return 'CARRYING ' + i.name.toUpperCase() + ' (' + i.stages + ' stage' + (i.stages>1?'s':'') + ')';
}

/* The chance of getting hurt rises sharply as condition and morale fall. */
function rollInjuries(startedResults, stage){
  const reports = [];
  startedResults.forEach(e => {
    const r = riderById(e.id);
    if(!r || (r.injury && r.injury.out)) return;
    const mor = (r.morale != null) ? r.morale : 70;
    let risk = 0.008 + (100 - r.condition)/100*0.050 + (100 - mor)/100*0.030;
    if(stage.type === 'cobbles') risk *= 2.0;
    else if(stage.type === 'mountain' || stage.type === 'medium') risk *= 1.25;
    if(e.energy < 5) risk *= 1.45;
    if(Math.random() > risk) return;
    const roll = Math.random();
    let inj;
    if(roll < 0.60){
      inj = {type:'knock', out:null, name:pickOne(KNOCKS),
             stages: 1 + Math.floor(Math.random()*3), penalty: 0.90};
    } else if(roll < 0.89){
      inj = {type:'race', out:'race', name:pickOne(RACE_OUT)};
    } else {
      inj = {type:'season', out:'season', name:pickOne(SEASON_OUT)};
    }
    r.injury = inj;
    r.morale = clamp(mor - (inj.out ? 22 : 8), 0, 100);
    reports.push(r.name + ' \u2014 ' + injuryLabel(r).toLowerCase());
  });
  return reports;
}
function tickInjuries(){
  G.riders.forEach(r => {
    if(r.injury && r.injury.type === 'knock'){
      r.injury.stages -= 1;
      if(r.injury.stages <= 0) r.injury = null;
    }
  });
}

/* ---------- MORALE ----------
   Riders judge their own season. Winning lifts them; being carried does not. */
function updateMorale(results){
  const startedIds = {};
  results.forEach(e => { if(e.mine) startedIds[e.id] = e.rank; });
  G.riders.forEach(r => {
    if(r.morale == null) r.morale = 75;
    const rank = startedIds[r.id];
    if(rank == null){ r.morale = clamp(r.morale - 1.5, 0, 100); return; }  // left out
    if(rank === 1)       r.morale = clamp(r.morale + 14, 0, 100);
    else if(rank <= 3)   r.morale = clamp(r.morale + 8, 0, 100);
    else if(rank <= 10)  r.morale = clamp(r.morale + 3, 0, 100);
    else if(rank <= 25)  r.morale = clamp(r.morale - 1, 0, 100);
    else                 r.morale = clamp(r.morale - 3.5, 0, 100);
  });
  const list = G.riders.filter(r=>r.morale != null);
  if(list.length) G.morale = list.reduce((a,r)=>a+r.morale,0)/list.length;
}

function suitabilityFor(r, type){
  const k = terrainStatKey(type);
  return r.stats[k]*1.5 + r.stats.endurance*0.6 + (r.condition/100)*4;
}
function tourSuitability(r){
  // picked for a whole Grand Tour, so all-round quality and freshness matter
  const gt = GRAND_TOURS[G.gtIndex];
  let v = 0;
  (gt ? gt.stages : []).forEach(st => { v += r.stats[terrainStatKey(st.type)]; });
  return v/Math.max(1,(gt?gt.stages.length:1))*1.5 + r.stats.endurance*0.5 +
         r.stats.recovery*0.5 + (r.condition/100)*4;
}
function autoLineup(){
  return G.riders.filter(riderAvailable).slice()
    .sort((a,b)=> tourSuitability(b) - tourSuitability(a))
    .slice(0, RACE_SQUAD_SIZE).map(r=>r.id);
}
/* The squad is locked for the whole Grand Tour; riders only leave it by abandoning. */
function raceLineup(){
  const ids = (G.tourSquad && G.tourSquad.length) ? G.tourSquad : autoLineup();
  return ids.map(id => G.riders.find(r=>r.id===id)).filter(r=>r && riderAvailable(r));
}
function toggleStarter(id){
  const r = riderById(id);
  if(!r || !riderAvailable(r)) return;
  if(!G.tourSquad) G.tourSquad = autoLineup();
  const i = G.tourSquad.indexOf(id);
  if(i >= 0) G.tourSquad.splice(i,1);
  else if(G.tourSquad.length < RACE_SQUAD_SIZE) G.tourSquad.push(id);
  render();
}

function currentStages(){ return GRAND_TOURS[G.gtIndex].stages; }
function currentStage(){ return currentStages()[G.stageIdx]; }

/* --- terrain --- */
function elevAt(key, xPct){
  const pts = ELEVATION[key] || ELEVATION['giro-0'];
  xPct = clamp(xPct,0,100);
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
    if(xPct>=x0 && xPct<=x1){
      const t = x1===x0?0:(xPct-x0)/(x1-x0);
      return y0+(y1-y0)*t;
    }
  }
  return pts[pts.length-1][1];
}
/* road gradient in percent at a given point of the stage */
function gradientAt(key, xPct, totalKm){
  const dx = 0.6;
  const e0 = elevAt(key, xPct-dx/2), e1 = elevAt(key, xPct+dx/2);
  const runMetres = (dx/100)*totalKm*1000;
  return ((e1-e0)/runMetres)*100;
}
function elevRange(key){
  const ys = (ELEVATION[key] || ELEVATION['giro-0']).map(p=>p[1]);
  return {min:Math.min(...ys), max:Math.max(...ys)};
}
