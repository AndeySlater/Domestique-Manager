function updateRaceUI(){
  if(!G.race) return;                       // the stage may have just ended
  const set = (id, html) => { const el=document.getElementById(id); if(el) el.innerHTML = html; };
  set('raceMeta', raceMetaHtml());
  set('profileBox', profileBlockHtml());
  const R = G.race;
  if(R.type === 'tt'){
    set('groupsBox', ttStandingsHtml());
    updateTeamRows();
  } else {
    // Never rebuild the orders panel while the player is dragging a rider, and
    // key rebuilds on stable group NAMES (indices shift constantly), with a
    // cooldown — otherwise the cards are destroyed mid-click and mid-drag.
    const sig = R.riders.filter(r=>r.mine).map(r=>r.groupName+(r.finished?'F':'')).join(',')
              + '|' + (R.gcLeaderId||'') + '|' + (R.teamOrder||[]).join('');
    const now = Date.now();
    const cooled = !R._lastPanelBuild || (now - R._lastPanelBuild) > 2500;
    const locked = R._lockUntil && now < R._lockUntil;
    if(!R._dragging && !locked && sig !== R._teamSig && cooled){
      R._teamSig = sig; R._lastPanelBuild = now;
      set('raceBox', mergedRaceHtml());
    } else {
      updateMergedHeaders(); updateTeamRows();
    }
  }
  set('evtBox', eventsHtml());
  if(R.showGC) set('vgcBox', virtualGcHtml());
  const fo = (R.finishOrder||[]).length;
  if(fo !== R._finSig){ R._finSig = fo; set('finishBox', finishFeedHtml()); }
  const dk = document.getElementById('dockKm');
  if(dk){ const lead = R.groups[0]?R.groups[0].leadDist:0;
    dk.textContent = Math.max(0, R.distTotal-lead).toFixed(1)+' KM TO GO'; }
  const rb = document.getElementById('runBtn');
  if(rb) rb.textContent = G.race.running ? '❚❚ PAUSE' : '▶ RESUME';
  [1,2,4].forEach(m => {
    const b = document.getElementById('spd'+m);
    if(b) b.className = 'ctrl-btn' + (G.race.speedMult===m?' on':'');
  });
}

function finishStage(){
  const R = G.race;
  const stage = currentStage();
  const type = stage.type;

  // Real racing: everyone who crosses the line in the same group is given the
  // same time. Only a real split on the road costs you time on GC.
  const ordered = R.riders.slice().sort((a,b)=> a.finishTime - b.finishTime);
  // how far apart two riders must cross to be judged a genuine split
  const splitGap = (type === 'tt') ? 0
                 : ((type === 'flat' || type === 'cobbles') ? 8.0 : 4.5);
  let clusterTime = ordered.length ? ordered[0].finishTime : 0;
  const results = ordered.map((r,i) => {
    if(i > 0 && (r.finishTime - ordered[i-1].finishTime) > splitGap) clusterTime = r.finishTime;
    return {id:r.id, name:r.name, emoji:r.emoji, team:r.team, mine:r.mine,
            time:clusterTime, rawTime:r.finishTime, rank:i+1, energy:r.energy};
  });
  const winnerTime = results.length ? results[0].time : 0;

  // season team points from the stage top 10
  results.slice(0,10).forEach(e => {
    G.season[e.team] = (G.season[e.team]||0) + (STAGE_POINTS[e.rank-1]||0);
  });
  // sprint / KOM classifications
  const ptsTable = (type==='mountain') ? KOM_PTS : SPRINT_PTS;
  const bucket   = (type==='mountain') ? G.komPts : G.sprintPts;
  results.slice(0, ptsTable.length).forEach(e => { bucket[e.id] = (bucket[e.id]||0) + ptsTable[e.rank-1]; });
  // general classification
  results.forEach(e => { G.gcTimes[e.id] = (G.gcTimes[e.id]||0) + e.time; });

  // XP + condition for your riders
  const notes = [];
  results.filter(e=>e.mine).forEach(e => {
    const own = riderById(e.id);
    if(!own) return;
    own.gtPoints = (own.gtPoints||0) + (STAGE_POINTS[e.rank-1]||0);
    G.sponsorProgress = G.sponsorProgress || freshSponsorProgress();
    if(e.rank === 1) G.sponsorProgress.stageWins++;
    if(e.rank <= 3) G.sponsorProgress.podiums++;
    if(e.rank <= 10) G.sponsorProgress.top10s++;
    // results are what build a following, and a following is what attracts sponsors
    if(e.rank === 1)      G.reputation = clamp(G.reputation + 2.2, 0, 100);
    else if(e.rank <= 3)  G.reputation = clamp(G.reputation + 0.9, 0, 100);
    else if(e.rank <= 10) G.reputation = clamp(G.reputation + 0.25, 0, 100);
    const xp = Math.round(xpForResult(e.rank, results.length) * coachXpMult(own));
    awardXp(own, xp);
    const spent = 100 - e.energy;
    own.condition = clamp(own.condition - (3 + spent*0.075), 0, 100);
    if(e.energy < 3) notes.push(`${e.name} finished completely empty — that will cost condition tomorrow.`);
  });

  // reserves rest up while the race is on
  const started = {};
  results.forEach(e=>{ if(e.mine) started[e.id]=true; });
  G.riders.forEach(r => { if(!started[r.id]) r.condition = clamp(r.condition + 4, 0, 100); });

  // morale, then knocks heal a stage, then today's crashes and strains
  updateMorale(results);
  tickInjuries();
  const injuries = rollInjuries(results.filter(e=>e.mine), stage);
  if(injuries.length) injuries.forEach(t => notes.push(t));

  checkSponsorObjectives();
  G.lastStage = {stage, results, winnerTime, notes, injuries};
  G.race = null;
  G.screen = 'stageresult';
  render();
}

function finishGrandTour(){
  const gcList = gcSortedList();
  gcList.slice(0,10).forEach(([id],i) => {
    const m = metaById(id);
    if(m) G.season[m.team] = (G.season[m.team]||0) + (GC_POINTS[i]||0);
  });
  const spr = ptsSortedList(G.sprintPts), kom = ptsSortedList(G.komPts);
  [spr, kom].forEach(list => {
    if(!list.length) return;
    const m = metaById(list[0][0]);
    if(m) G.season[m.team] = (G.season[m.team]||0) + JERSEY_POINTS;
  });
  G.gtSummaries[G.gtIndex] = {gcList, sprint:spr, kom:kom};
  // a Grand Tour pays out: prize money, morale and reputation follow results
  const myBest = gcList.findIndex(([id]) => { const m=metaById(id); return m && m.mine; });
  const placed = myBest >= 0 ? myBest+1 : 99;
  G.sponsorProgress = G.sponsorProgress || freshSponsorProgress();
  G.sponsorProgress.bestGc = Math.min(G.sponsorProgress.bestGc, placed);
  const earned = clamp(Math.round(140 - placed*9), 30, 140);
  G.coins += earned;
  G.morale = clamp(G.morale + (placed<=3 ? 8 : (placed<=10 ? 2 : -6)), 20, 100);
  // a Grand Tour is where a team's name is really made
  G.reputation = clamp(G.reputation +
    (placed<=1 ? 20 : (placed<=3 ? 14 : (placed<=5 ? 10 : (placed<=10 ? 6 : 2)))), 0, 100);
  G.lastPayout = {earned, placed};

  // Results move a rider's price. Deliver and he is worth more than you paid;
  // disappear for three weeks and the market marks him down.
  const moves = [];
  G.riders.forEach(r => {
    const scored = r.gtPoints || 0;
    const expected = computeOvr(r) * 7;          // what a rider of his standing should return
    const before = marketValue(r);
    let mod = r.valueMod || 1;
    if(scored >= expected*1.6)      mod *= 1.18;
    else if(scored >= expected)     mod *= 1.08;
    else if(scored >= expected*0.4) mod *= 0.98;
    else                            mod *= 0.88;
    r.valueMod = clamp(mod, 0.5, 1.9);
    const after = marketValue(r);
    if(Math.abs(after-before) >= 4) moves.push({name:r.name, before, after});
    r.gtPoints = 0;
  });
  G.lastValueMoves = moves.sort((a,b)=>(b.after-b.before)-(a.after-a.before)).slice(0,4);
  checkSponsorObjectives();
  G.screen='gtresult'; render();
}

function endSeason(){
  if(G.seasonEnded) return;
  G.seasonEnded = true;
  G.ageReport = [];
  // did you deliver what your backer asked for?
  if(G.sponsor){
    const missed = G.sponsor.objectives.filter(o => !objectiveMet(o));
    G.sponsorVerdict = {
      kept: missed.length === 0,
      missed: missed.map(o => o.label + ' (' + objectiveText(o) + ')'),
    };
    G.sponsorLost = missed.length > 0;
  }
  G.riders.forEach(r => {
    r.age = (r.age||27) + 1;
    r.contract = Math.max(0, (r.contract||1) - 1);
    // riders past their peak start to lose something each winter
    if(r.age >= 31 && Math.random() < (r.age >= 34 ? 0.8 : 0.45)){
      const keys = ['sprint','hill','mountain','tt','endurance','recovery']
        .filter(k => r.stats[k] > 1)
        .sort((a,b)=> r.stats[b]-r.stats[a]);
      const hit = keys[Math.floor(Math.random()*Math.min(3,keys.length))];
      if(hit){ r.stats[hit] -= 1; G.ageReport.push(r.name+' is '+r.age+' and has lost a point of '+hit+'.'); }
    }
    if(r.contract === 0) G.ageReport.push(r.name+"'s contract has expired.");
  });
}
function startNextSeason(){
  G.year = (G.year||1) + 1;
  // riders whose deal has run out leave the team
  const leaving = G.riders.filter(r => (r.contract||0) <= 0);
  leaving.forEach(r => { G.lastDeal = (G.lastDeal? G.lastDeal+' ':'') + r.name + ' has left the team.'; });
  G.riders = G.riders.filter(r => (r.contract||0) > 0);
  // a fresh season: new race calendar positions, new market, new rivals' form
  G.gtIndex = 0; G.stageIdx = 0; G.tourStarted = false;
  G.gtSummaries = []; G.season = freshSeasonPoints();
  G.seasonEnded = false; G.sponsorVerdict = null; G.ageReport = null;
  G.sponsorProgress = freshSponsorProgress();
  G.sponsorNews = null;
  G.rivalField = buildRivalField();
  G.market = null; ensureMarket(10);
  G.tourSquad = null;
  G.riders.forEach(r => { r.injury = null; r.morale = clamp((r.morale||70)+12, 0, 100); });
  resetGtClassification();
  if(G.sponsorLost || !G.sponsor){ G.screen = 'sponsor'; }
  else if(G.riders.length < RACE_SQUAD_SIZE){ G.buildMode = true; G.screen = 'transfer'; }
  else { G.screen = 'main'; }
  render();
}

/* ---------- team-wide ratings shown as star cards ---------- */
/* How strong the SQUAD is in each discipline: your best man counts most, but a
   team with depth behind him rates higher than a one-man band. */
const DISCIPLINE_MIX = {
  SPRINT: s => s.sprint*0.72 + s.endurance*0.18 + s.recovery*0.10,
  GC:     s => s.mountain*0.50 + s.tt*0.22 + s.endurance*0.18 + s.recovery*0.10,
  PUNCH:  s => s.hill*0.62 + s.sprint*0.18 + s.endurance*0.20,
};
function disciplineRating(disc){
  const mix = DISCIPLINE_MIX[disc];
  const scores = G.riders.map(r => ({r, v: mix(r.stats)})).sort((a,b)=> b.v - a.v);
  if(!scores.length) return {stars:0, name:'\u2014', value:0, coach:0};
  const w = [0.55, 0.27, 0.18];
  let total = 0, wsum = 0;
  for(let i=0;i<3 && i<scores.length;i++){ total += scores[i].v*w[i]; wsum += w[i]; }
  let value = total/wsum;
  // a specialist coach lifts the whole team's level in his discipline
  const coachBump = G.coach ? G.coach.abil[disc]*0.115 : 0;
  value = clamp(value + coachBump, 0, 10);
  return {stars: clamp(Math.round((value/10*5)*2)/2, 0.5, 5), name: scores[0].r.name, value, coach:coachBump};
}
function teamRatings(){
  return { SPRINT: disciplineRating('SPRINT'), GC: disciplineRating('GC'), PUNCH: disciplineRating('PUNCH') };
}
function teamOverall(){
  const t = teamRatings();
  return clamp(Math.round(((t.SPRINT.stars + t.GC.stars + t.PUNCH.stars)/3)*2)/2, 0.5, 5);
}
function avgCondition(){ return G.riders.reduce((a,r)=>a+r.condition,0)/G.riders.length; }

function starCardsHtml(){
  const t = teamRatings();
  return Object.keys(t).map(k=>`<div class="statcard" title="Best: ${t[k].name}">
      <div class="lbl">${k}</div>
      <div class="val" style="color:var(--gold);font-size:15px;">${starString(t[k].stars)||'\u00bd'}</div>
      <div class="lbl" style="color:#ffd9d2;">${t[k].stars.toFixed(1)}${t[k].coach>0.05?' \u25b2':''}</div>
    </div>`).join('');
}
function meterHtml(label, val, color){
  return `<div class="meterbox"><div class="lbl">${label}</div>
    <div class="meter"><i style="width:${clamp(val,0,100)}%;background:${color||barColor(val)};"></i></div></div>`;
}

  if(dn && dn.value.trim()) G.dsName = dn.value.trim();
  if(!G.dsName) G.dsName = 'The Boss';
  if(tn && tn.value.trim()) G.teamName = tn.value.trim();
  G.screen='sponsor'; render();
}

/* Who will even take your call depends on the team's standing. */
function sponsorAvailable(sp){ return G.reputation >= (sp.minRep||0); }

function freshSponsorProgress(){
  return {stageWins:0, podiums:0, top10s:0, bestGc:99, claimed:{}};
}
function sponsorStat(key){
  const p = G.sponsorProgress || freshSponsorProgress();
  if(key === 'stageWins') return p.stageWins;
  if(key === 'podiums')   return p.podiums;
  if(key === 'top10')     return p.top10s;
  if(key === 'bestGc')    return p.bestGc;
  if(key === 'fan')       return Math.round(G.reputation);
  return 0;
}
function objectiveMet(o){
  const v = sponsorStat(o.key);
  return (o.key === 'bestGc') ? v <= o.target : v >= o.target;
}
function objectiveText(o){
  const v = sponsorStat(o.key);
  if(o.key === 'bestGc') return v >= 99 ? 'best overall: —' : 'best overall: ' + v + getOrdinal(v);
  if(o.key === 'fan')    return v + '% / ' + o.target + '%';
  return v + ' / ' + o.target;
}
/* Bonuses are paid the moment a target is hit. */
function checkSponsorObjectives(){
  if(!G.sponsor) return;
  G.sponsorProgress = G.sponsorProgress || freshSponsorProgress();
  G.sponsor.objectives.forEach((o,i) => {
    if(G.sponsorProgress.claimed[i]) return;
    if(objectiveMet(o)){
      G.sponsorProgress.claimed[i] = true;
      G.coins += o.bonus;
      G.sponsorNews = G.sponsor.name + ' pays a ' + o.bonus + ' coin bonus: ' + o.label.toLowerCase() + '.';
    }
  });
}
function sponsorPanelHtml(){
  if(!G.sponsor) return '';
  const rows = G.sponsor.objectives.map((o,i)=>{
    const done = G.sponsorProgress && G.sponsorProgress.claimed[i];
    const met = objectiveMet(o);
    return `<div class="obj-row ${done||met?'done':''}">
      <span class="obj-tick">${done||met?'\u2714':'\u25cb'}</span>
      <span class="obj-lbl">${o.label}</span>
      <span class="obj-val">${objectiveText(o)}</span>
      <span class="obj-bonus"><span class="coin-ico"></span>${o.bonus}</span>
    </div>`;
  }).join('');
  return `<div class="rpanel">
    <div class="rpanel-h">SPONSOR \u2014 ${G.sponsor.name}</div>
    ${rows}
    ${G.sponsorNews?`<div class="flavor" style="color:var(--gold);margin-top:6px;">${G.sponsorNews}</div>`:''}
    <div class="flavor" style="margin-top:6px;">Meet every objective by the end of the season or they walk away.</div>
  </div>`;
}

function pickSponsor(id){
  const sp = SPONSORS.find(x=>x.id===id);
  if(!sp || !sponsorAvailable(sp)) return;
  G.sponsor = JSON.parse(JSON.stringify(sp));
  G.sponsorProgress = freshSponsorProgress();
  G.sponsorNews = null;
  if(!G.careerStarted){
    // a brand new team: the sponsor's cheque, and no riders at all
    G.careerStarted = true;
    G.coins = sp.budget;
    G.riders = [];
    G.market = null;
    ensureMarket(14);
    G.buildMode = true;
    G.screen = 'transfer';
  } else {
    G.coins += sp.budget;
    G.sponsorLost = false;
    G.screen = 'main';
  }
  render();
}
function confirmSquad(){
  if(G.riders.length < 6) return;
  G.buildMode = false;
  G.selectedRider = G.riders[0].id;
  G.screen = 'main';
  render();
}

/* ---------- TRANSFER MARKET ---------- */
const FIRST_NAMES = ['Luca','Mateo','Ander','Jens','Robin','Tomas','Ivan','Pau','Nils','Gaspard',
                     'Ruben','Elias','Mads','Aurelien','Bruno','Kasper','Milan','Yannick'];
const LAST_NAMES  = ['Moretti','Berg','Aguirre','Vermeulen','Kowal','Novak','Delacroix','Ferrer',
                     'Haugen','Rossi','Baptiste','Lindqvist','Marchand','Pereira','Sorensen','Vidal'];
const MARKET_NATIONS = [
  {n:'IT', f:'\u{1F1EE}\u{1F1F9}'}, {n:'ES', f:'\u{1F1EA}\u{1F1F8}'}, {n:'FR', f:'\u{1F1EB}\u{1F1F7}'},
  {n:'BE', f:'\u{1F1E7}\u{1F1EA}'}, {n:'NO', f:'\u{1F1F3}\u{1F1F4}'}, {n:'CO', f:'\u{1F1E8}\u{1F1F4}'},
  {n:'GB', f:'\u{1F1EC}\u{1F1E7}'}, {n:'DK', f:'\u{1F1E9}\u{1F1F0}'},
];
let MARKET_SEQ = 0;
function makeMarketRider(){
  const roles = Object.keys(ROLE_TEMPLATES);
  const role = roles[Math.floor(Math.random()*roles.length)];
  const t = ROLE_TEMPLATES[role];
  const age = Math.floor(rand(19, 35));
  const bracket = ageBracket(age);
  // prospects start below their ceiling; veterans are already there
  const shade = bracket==='prospect' ? -2 : (bracket==='rising' ? -1 : 0);
  const stats = {};
  ['sprint','hill','mountain','tt','endurance','recovery'].forEach(k=>{
    stats[k] = clamp(Math.round(rand(t[k][0], t[k][1])) + shade, 1, 10);
  });
  const nat = MARKET_NATIONS[Math.floor(Math.random()*MARKET_NATIONS.length)];
  const r = {
    id:'mkt'+(MARKET_SEQ++),
    name: FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)] + ' ' +
          LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)],
    nat:nat.n, flag:nat.f, role, emoji:t.emoji, age,
    xp:0, condition:Math.round(rand(80,100)), pendingLevelUps:0, contract:0, valueMod:1,
    morale:Math.round(rand(68,86)), injury:null, stats,
  };
  // potential: prospects have plenty of upside, veterans none
  const ovr = computeOvr(r);
  const upside = bracket==='prospect' ? rand(0.5,1.5) : (bracket==='rising' ? rand(0,1) : 0);
  r.potential = clamp(Math.round((ovr + upside)*2)/2, 0.5, 5);
  return r;
}
function ensureMarket(n){
  if(!G.market || !G.market.length){
    G.market = [];
    for(let i=0;i<(n||8);i++) G.market.push(makeMarketRider());
  }
  return G.market;
}
function scoutMarket(){
  if(G.coins < 25) return;
  G.coins -= 25;
  G.market = [];
  ensureMarket(8);
  render();
}
function buyRider(id, years){
  const idx = (G.market||[]).findIndex(r=>r.id===id);
  if(idx < 0) return;
  const r = G.market[idx];
  const fee = transferFee(r, years);
  if(G.coins < fee) return;
  if(G.riders.length >= 10) return;
  G.coins -= fee;
  const signed = JSON.parse(JSON.stringify(r));
  signed.id = 'own'+(MARKET_SEQ++);
  signed.contract = years;
  signed.paid = fee;
  G.riders.push(signed);
  G.market.splice(idx, 1);
  G.lastDeal = 'Signed ' + signed.name + ' for ' + fee + ' coins on a ' + years + '-year deal.';
  render();
}
function sellRider(id){
  if(!G.buildMode && G.riders.length <= 6) { G.lastDeal = 'You must keep at least 6 riders.'; render(); return; }
  const idx = G.riders.findIndex(r=>r.id===id);
  if(idx < 0) return;
  const r = G.riders[idx];
  const price = sellPrice(r);
  G.coins += price;
  const profit = r.paid != null ? price - r.paid : null;
  G.riders.splice(idx, 1);
  if(G.selectedRider === id) G.selectedRider = G.riders.length ? G.riders[0].id : null;
  G.lastDeal = 'Sold ' + r.name + ' for ' + price + ' coins' +
    (profit != null ? (profit >= 0 ? ' (profit ' + profit + ')' : ' (loss ' + Math.abs(profit) + ')') : '') + '.';
  render();
}

function renderTransfers(){
  ensureMarket(8);
  const mine = G.riders.map(r=>{
    const v = marketValue(r), tr = valueTrend(r);
    const col = tr.dir==='up'?'var(--green)':(tr.dir==='down'?'var(--polka)':'var(--muted)');
    const paid = r.paid != null ? r.paid : null;
    const delta = paid != null ? v - paid : null;
    return `<div class="mkt-row">
      <div class="mkt-port">${riderAvatar(r,54)}</div>
      <div class="mkt-main">
        <div class="mkt-name">${r.flag||''} ${r.name} <span class="mkt-age">${r.age}y</span></div>
        <div class="mkt-sub">${r.role} \u00b7 OVR ${computeOvr(r)} \u00b7 POT ${potentialOf(r)} \u00b7 ${r.contract||1}y left</div>
        <div class="mkt-sub" style="color:${col};">value ${v} \u00b7 ${tr.txt}${
          delta!=null ? ` \u00b7 paid ${paid} (${delta>=0?'+':''}${delta})` : ''}</div>
      </div>
      <button class="buycoin" data-act="sell" data-id="${r.id}"><span class="coin-ico"></span>SELL ${sellPrice(r)}</button>
    </div>`;
  }).join('');

  const market = G.market.map(r=>{
    const v = marketValue(r);
    const fees = [1,2,3].map(y=>{
      const f = transferFee(r,y);
      return `<button class="buycoin" ${G.coins>=f && G.riders.length<10 ?'':'disabled'}
        data-act="buy" data-id="${r.id}" data-arg="${y}"><span class="coin-ico"></span>${y}y \u00b7 ${f}</button>`;
    }).join('');
    return `<div class="mkt-row">
      <div class="mkt-port">${riderAvatar(r,54)}</div>
      <div class="mkt-main">
        <div class="mkt-name">${r.flag} ${r.name} <span class="mkt-age">${r.age}y</span></div>
        <div class="mkt-sub">${r.role} \u00b7 OVR ${computeOvr(r)} \u00b7 POT ${potentialOf(r)}</div>
        <div class="mkt-sub">${['sprint','hill','mountain','tt','endurance','recovery']
          .map(k=>k.slice(0,3).toUpperCase()+' '+r.stats[k]).join(' \u00b7 ')}</div>
        <div class="mkt-sub" style="color:var(--gold);">market value ${v}</div>
      </div>
      <div class="mkt-buy">${fees}</div>
    </div>`;
  }).join('');

  const build = G.buildMode;
  const header = build
    ? banner('BUILD YOUR TEAM', 'SIGN AT LEAST 6 RIDERS')
    : topbar('TRANSFER MARKET', "G.screen='team'; render();");
  app.innerHTML = `${header}
    <div class="screen">
      ${build?`<div class="rpanel"><div class="flavor">
        ${G.sponsor?G.sponsor.name+' has given you <strong style="color:var(--gold)">'+G.coins+' coins</strong> to assemble a squad. ':''}
        Sign between 6 and 10 riders. Young riders cost more but improve; veterans are cheap and will decline.
        You need climbers for the mountains, a fast man for the sprints, and domestiques to do the work.
      </div></div>`:''}
      ${G.lastDeal?`<div class="rpanel" style="border-color:var(--gold);"><div class="flavor" style="color:var(--gold);">${G.lastDeal}</div></div>`:''}
      <div class="race-grid">
        <div class="race-col" style="max-height:none;overflow:visible;">
          <div class="rpanel">
            <div class="rpanel-h">YOUR SQUAD \u2014 ${G.riders.length}/10</div>
            <div class="flavor" style="margin-bottom:8px;">A rider's value moves with his results. Sell high, and
              don't carry a veteran whose price is sliding. Minimum squad size is 6.</div>
            ${mine}
          </div>
        </div>
        <div class="race-col" style="max-height:none;overflow:visible;">
          <div class="rpanel">
            <div class="rpanel-h">AVAILABLE RIDERS</div>
            <div class="flavor" style="margin-bottom:8px;">You buy a rider on a contract of one to three years \u2014
              a longer deal costs more up front. Young riders cost a premium for their potential; riders past 30 are cheap
              but decline.</div>
            ${market}
            <button class="buycoin" style="margin-top:8px;" ${G.coins>=25?'':'disabled'} data-act="scout">
              <span class="coin-ico"></span>SCOUT NEW RIDERS \u2014 25</button>
          </div>
        </div>
      </div>
      ${build?`<button class="navbtn" ${G.riders.length>=6?'':'disabled'} onclick="confirmSquad();">
        ${G.riders.length>=6?'CONFIRM SQUAD \u2014 '+G.riders.length+' RIDERS':'SIGN '+(6-G.riders.length)+' MORE RIDER'+((6-G.riders.length)>1?'S':'')}</button>`:''}
    </div>`;
}

/* ---------- STAR RIDERS (TEAM) ---------- */
function renderTeam(){
  const sel = G.riders.find(r=>r.id===G.selectedRider) || G.riders[0];
  const cards = G.riders.map(r=>{
    const ovr = computeOvr(r);
    const needsAttention = r.pendingLevelUps>0;
    return `<div class="rcard ${sel&&sel.id===r.id?'sel':''}" onclick="G.selectedRider='${r.id}'; render();">
      <div class="port">
        ${riderAvatar(r, 74)}
        <span class="flag">${r.flag||''}</span>
        ${needsAttention?'<span class="alert-dot">!</span>':''}
      </div>
      <div class="nm">${r.name.split(' ').pop().toUpperCase()}</div>
      <div class="st">${starString(ovr)||'\u00bd'}</div>
      <div class="nm" style="color:var(--muted);font-size:7px;">${r.age||'?'}Y \u00b7 ${marketValue(r)}</div>
      ${r.injury?`<div class="nm" style="color:${r.injury.out?'var(--polka)':'var(--orange)'};font-size:7px;">\u2695 ${r.injury.out==='season'?'SEASON':(r.injury.out==='race'?'OUT':'KNOCK')}</div>`:''}
      <div class="cbar"><i style="width:${r.condition}%;background:${conditionColor(r.condition)};"></i></div>
    </div>`;
  }).join('');

  const lu = sel && sel.pendingLevelUps>0 ? `
    <div class="levelup-box">
      <div class="lbl">\u2605 LEVEL UP! ${sel.pendingLevelUps} point(s) to spend</div>
      <div class="levelup-opts">${['sprint','hill','mountain','tt','endurance','recovery']
        .map(k=>`<button onclick="allocateStat('${sel.id}','${k}')">${k}</button>`).join('')}</div>
    </div>` : '';

  app.innerHTML = `
    ${topbar('STAR RIDERS')}
    <div class="screen">
      <div class="rpanel">
        <div class="statrow">
          <div class="statcard"><div class="lbl">CONDITION</div><div class="val">${Math.round(avgCondition())}%</div></div>
          <div class="statcard"><div class="lbl">MORALE</div><div class="val">${Math.round(G.morale)}%</div></div>
          ${starCardsHtml()}
        </div>
      </div>
      <div class="race-grid">
        <div class="race-col" style="max-height:none;overflow:visible;">
          <div class="rpanel">
            <div class="rpanel-h">SQUAD</div>
            <div class="ridergrid">${cards}</div>
          </div>
        </div>
        <div class="race-col" style="max-height:none;overflow:visible;">
          ${sel?`<div class="rpanel">
            <div class="rpanel-h">${sel.name.toUpperCase()}</div>
            <div style="display:flex;gap:10px;align-items:flex-start;">
              <div style="width:96px;flex:0 0 auto;border:3px solid var(--deep);">${riderAvatar(sel,96)}</div>
              <div style="flex:1;min-width:0;">
                <div class="stat-row"><span class="stat-label">Role</span><span style="color:#fff">${sel.flag||''} ${sel.role}</span></div>
                <div class="stat-row"><span class="stat-label">OVR</span><span class="stars">${starString(computeOvr(sel))}</span></div>
                <div class="stat-row"><span class="stat-label">Potential</span><span class="stars potential">${starString(potentialOf(sel))}</span></div>
                <div class="stat-row"><span class="stat-label">Level</span><span style="color:#fff">Lv.${xpProgress(sel.xp).level}</span>
                  <span class="cond-bar-bg" style="flex:1;height:9px;"><span style="display:block;height:100%;width:${xpProgress(sel.xp).pct}%;background:var(--gold);"></span></span>
                  <span style="color:var(--muted);font-size:13px;">${xpProgress(sel.xp).into}/${xpProgress(sel.xp).need}</span></div>
                <div class="stat-row"><span class="stat-label">Age</span><span style="color:#fff">${sel.age||'?'}
                  <span style="color:var(--muted);font-size:13px;">(${ageBracket(sel.age||27)})</span></span></div>
                <div class="stat-row"><span class="stat-label">Contract</span><span style="color:#fff">${sel.contract||1} year(s) left</span></div>
                <div class="stat-row"><span class="stat-label">Morale</span>
                  <span class="cond-bar-bg" style="flex:1;height:9px;"><span style="display:block;height:100%;width:${sel.morale||70}%;background:${barColor(sel.morale||70)};"></span></span>
                  <span style="color:var(--muted);font-size:13px;">${Math.round(sel.morale||70)}%</span></div>
                ${sel.injury?`<div class="stat-row"><span class="stat-label">Injury</span>
                  <span style="color:${sel.injury.out?'var(--polka)':'var(--orange)'};font-size:14px;">${injuryLabel(sel)}</span></div>`:''}
                <div class="stat-row"><span class="stat-label">Value</span>
                  <span style="color:var(--gold)">${marketValue(sel)}</span>
                  <span style="color:var(--muted);font-size:13px;">${valueTrend(sel).txt}${
                    sel.paid!=null?' \u00b7 paid '+sel.paid:''}</span></div>
              </div>
            </div>
            ${conditionBar(sel.condition)}
            <div class="stats-grid" style="margin-top:6px;">
              ${statBar('Sprint',sel.stats.sprint,statCap(sel,'sprint'))}${statBar('Hill',sel.stats.hill,statCap(sel,'hill'))}
              ${statBar('Mountain',sel.stats.mountain,statCap(sel,'mountain'))}${statBar('TT',sel.stats.tt,statCap(sel,'tt'))}
              ${statBar('Endurance',sel.stats.endurance,statCap(sel,'endurance'))}${statBar('Recovery',sel.stats.recovery,statCap(sel,'recovery'))}
            </div>
            <div class="flavor" style="margin-top:4px;font-size:13px;">
              Faint blocks show how far his potential lets him develop (ceiling ${statCap(sel)}/10).</div>
            ${lu}
          </div>`:''}
          <div class="rpanel">
            <div class="rpanel-h">ATTRIBUTES</div>
            <div class="legend">${ATTRIBUTE_INFO.map(([k,v])=>`<div><strong style="color:#fff">${k}</strong> \u2014 ${v}</div>`).join('')}</div>
          </div>
        </div>
      </div>
      <button class="navbtn" onclick="G.lastDeal=null; G.screen='transfer'; render();">TRANSFER MARKET</button>
    </div>`;
}

function allocateStat(id,key){
  const r=riderById(id);
  if(!r||r.pendingLevelUps<=0) return;
  const cap = statCap(r, key);
  if(r.stats[key] >= cap) return;            // cannot develop past his potential
  r.stats[key]=clamp(r.stats[key]+1,0,cap); r.pendingLevelUps--; render();
}

function renderSeason(){
  const rows = GRAND_TOURS.map((gt,i)=>{
    let st='locked',lb='LOCKED';
    if(G.gtSummaries[i]){st='done';lb='COMPLETE';}
    else if(i===G.gtIndex){st='current';lb= G.tourStarted ? 'IN PROGRESS' : 'UP NEXT';}
    return `<div class="gt-row"><div><strong style="color:var(--cream)">${gt.name}</strong><br>
      <span class="flavor">${gt.country} \u00b7 5 stages</span></div><span class="badge ${st}">${lb}</span></div>`;
  }).join('');

  const gt = GRAND_TOURS[G.gtIndex];
  const stageRows = gt ? gt.stages.map((st,i)=>{
    const done = G.tourStarted && i < G.stageIdx;
    const now  = i === G.stageIdx;
    const meta = STAGE_TYPES[st.type];
    return `<tr class="${now?'you':''}">
      <td class="rank">${i+1}</td>
      <td><span class="badge ${meta.cls}" style="font-size:7px;padding:2px 4px;">${meta.label}</span></td>
      <td>${st.name}</td><td>${st.dist} km</td>
      <td style="color:${done?'var(--green)':(now?'var(--gold)':'var(--muted)')};font-size:13px;">
        ${done?'DONE':(now?'NEXT':'')}</td></tr>`;
  }).join('') : '';

  const rankRows = TEAM_NAMES.slice().sort((a,b)=>G.season[b]-G.season[a])
    .map((n,i)=>`<tr class="${n==='You'?'you':''}"><td class="rank">${i+1}</td>
      <td>${n==='You'?G.teamName:n}</td><td>${G.season[n]}</td></tr>`).join('');

  const done = G.gtSummaries.filter(Boolean).length===GRAND_TOURS.length;
  const canRide = !done && G.gtIndex < GRAND_TOURS.length && !G.gtSummaries[G.gtIndex];
  const label = G.tourStarted ? 'RIDE STAGE '+(G.stageIdx+1)+' \u2014 '+(gt?gt.stages[G.stageIdx].name:'')
                              : 'START THE '+(gt?gt.name.toUpperCase():'');
  const action = G.tourStarted ? 'resumeTour();' : 'startGrandTour('+G.gtIndex+');';

  app.innerHTML = `${topbar('SEASON CALENDAR', "G.screen='main'; render();")}
    <div class="screen">
      <div class="race-grid">
        <div class="race-col" style="max-height:none;overflow:visible;">
          <div class="rpanel">
            <div class="rpanel-h">GRAND TOURS</div>
            ${rows}
          </div>
          <div class="rpanel">
            <div class="rpanel-h">SEASON TEAM RANKING</div>
            <table class="table"><thead><tr><th>#</th><th>Team</th><th>Pts</th></tr></thead>
            <tbody>${rankRows}</tbody></table>
          </div>
        </div>
        <div class="race-col" style="max-height:none;overflow:visible;">
          <div class="rpanel">
            <div class="rpanel-h">${gt?gt.name.toUpperCase():'RACE'} \u2014 STAGES</div>
            <table class="table"><tbody>${stageRows}</tbody></table>
          </div>
        </div>
      </div>
      ${done ? `<button class="navbtn" onclick="G.screen='final'; render();">VIEW SEASON FINALE</button>`
             : (canRide ? `<button class="navbtn" onclick="${action}">${label}</button>` : '')}
    </div>`;
}

function startGrandTour(i){
  G.gtIndex = i; G.stageIdx = 0;
  G.tourSquad = null;
  G.screen = 'tourteam';
  render();
}
function confirmTourSquad(){
  if(!G.tourSquad || G.tourSquad.length !== RACE_SQUAD_SIZE) return;
  G.tourStarted = true;
  resetGtClassification();
  goPrestage();
}
function renderTourTeam(){
  const gt = GRAND_TOURS[G.gtIndex];
  if(!G.tourSquad) G.tourSquad = autoLineup();
  const picked = G.tourSquad.length;
  const cards = G.riders.map(r=>{
    const avail = riderAvailable(r);
    const inTeam = G.tourSquad.indexOf(r.id) >= 0;
    const inj = r.injury ? `<div style="color:${r.injury.out?'var(--polka)':'var(--orange)'};font-size:13px;">${injuryLabel(r)}</div>` : '';
    return `<div class="rider-card ${inTeam?'chosen':''}" style="cursor:${avail?'pointer':'not-allowed'};opacity:${avail?1:.5};"
        ${avail?`onclick="toggleStarter('${r.id}')"`:''}>
      <div class="rider-head">
        <span class="rider-name">${r.emoji} ${r.name}</span>
        <span class="rider-role">${!avail?'<span style="color:var(--polka)">UNAVAILABLE</span>':(inTeam?'<span style="color:var(--gold)">SELECTED</span>':'reserve')}</span>
      </div>
      <div class="stat-row"><span class="stat-label">${r.role}</span>
        <span style="color:var(--muted);font-size:13px;">age ${r.age||'?'} \u00b7 OVR ${computeOvr(r)} \u00b7 suits this race ${(tourSuitability(r)/4).toFixed(1)}/10</span></div>
      ${conditionBar(r.condition)}
      <div class="stat-row"><span class="stat-label">Morale</span>
        <span class="cond-bar-bg"><span class="cond-bar-fill" style="width:${r.morale||70}%;background:${barColor(r.morale||70)};"></span></span>
        <span style="width:30px;text-align:right;">${Math.round(r.morale||70)}%</span></div>
      ${inj}
    </div>`;
  }).join('');
  app.innerHTML = `${topbar(gt.name.toUpperCase()+' \u00b7 TEAM SHEET', "G.screen='season'; render();")}
    <div class="screen">
      <div class="stage-banner">
        <h2>${gt.name} \u2014 select your six</h2>
        <div class="desc">These six ride all five stages. You cannot change them once the race begins,
          so balance the squad across ${gt.stages.map(st=>STAGE_TYPES[st.type].label.toLowerCase()).join(', ')} \u2014
          and think about condition and morale, because tired, unhappy riders get hurt.</div>
      </div>
      <div class="rpanel">
        <div class="rpanel-h">SQUAD \u2014 ${picked}/${RACE_SQUAD_SIZE} SELECTED</div>
        <div class="rider-grid">${cards}</div>
      </div>
      <button class="navbtn" ${picked===RACE_SQUAD_SIZE?'':'disabled'} onclick="confirmTourSquad();">
        ${picked===RACE_SQUAD_SIZE?'CONFIRM SQUAD \u2014 START THE RACE':'PICK '+(RACE_SQUAD_SIZE-picked)+' MORE'}</button>
    </div>`;
}
function resumeTour(){ G.tourStarted = true; if(!G.tourSquad){ G.screen='tourteam'; render(); return; } goPrestage(); }
function goPrestage(){ G.screen='prestage'; G.lineup = autoLineup(currentStage().type); render(); }

function renderPrestage(){
  const stage=currentStage(), meta=STAGE_TYPES[stage.type], gt=GRAND_TOURS[G.gtIndex];
  const {min,max}=elevRange(stage.key);
  const pts=ELEVATION[stage.key];
  const H=42, yFor=e=>H-((e-min)/Math.max(1,(max-min)))*(H-6)-2;
  const line=pts.map(p=>`${p[0]},${yFor(p[1]).toFixed(2)}`).join(' ');
  let bands='';
  for(let x=0;x<100;x+=0.5){
    const g=gradientAt(stage.key,x+0.25,stage.dist);
    const yT=yFor(elevAt(stage.key,x+0.25));
    bands+=`<rect x="${x}" y="${yT.toFixed(2)}" width="0.55" height="${(H-yT).toFixed(2)}" fill="${gradeColor(g)}"/>`;
  }
  const squad = raceLineup();
  const starters = squad.length;
  const abandoned = (G.tourSquad||[]).map(id=>riderById(id)).filter(r=>r && !riderAvailable(r));

  const cards = squad.map(r=>{
    const inj = r.injury ? `<div style="color:var(--orange);font-size:13px;">${injuryLabel(r)}</div>` : '';
    return `<div class="rider-card">
      <div class="rider-head">
        <span class="rider-name">${r.emoji} ${r.name}</span>
        <span class="rider-role">${r.role}</span>
      </div>
      <div class="stat-row"><span class="stat-label">Suits today</span>
        <span style="color:var(--muted);font-size:13px;">${(suitabilityFor(r,stage.type)/2).toFixed(1)}/10</span></div>
      ${conditionBar(r.condition)}
      <div class="stat-row"><span class="stat-label">Morale</span>
        <span class="cond-bar-bg"><span class="cond-bar-fill" style="width:${r.morale||70}%;background:${barColor(r.morale||70)};"></span></span>
        <span style="width:30px;text-align:right;">${Math.round(r.morale||70)}%</span></div>
      ${inj}
    </div>`;
  }).join('');

  app.innerHTML = `${topbar(gt.name+' \u00b7 Stage '+(G.stageIdx+1)+'/5', "G.screen='season'; render();")}
    <div class="screen">
      <div class="stage-banner">
        <span class="badge ${meta.cls}">${meta.label}</span>
        <h2>Stage ${G.stageIdx+1} \u00b7 ${stage.name}</h2>
        <div class="desc">${stage.desc} \u2014 ${stage.dist} km \u00b7 ${min}\u2013${max} m</div>
      </div>
      <div class="profile-box">
        <div class="profile-head"><span>ROUTE</span><span>${(CLIMBS[stage.key]||[]).map(c=>c.name).join(' \u00b7 ')||'no categorised climbs'}</span></div>
        <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="width:100%;height:110px;display:block;background:#0d1f3d;">
          ${bands}
          <polyline points="${line}" fill="none" stroke="#fff" stroke-width="0.7" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
      <div class="rpanel">
        <div class="rpanel-h">YOUR RACE SQUAD \u2014 ${starters} STILL IN THE RACE</div>
        <div class="flavor" style="margin-bottom:8px;">These riders were selected for the whole Grand Tour and cannot be changed.
          ${abandoned.length?`<span style="color:var(--polka)">${abandoned.map(r=>r.name+' has abandoned ('+r.injury.name+')').join('. ')}.</span>`:''}</div>
        <div class="rider-grid">${cards}</div>
      </div>
      <button class="navbtn" ${starters>0?'':'disabled'} onclick="beginStage();">RACE THIS STAGE</button>
      <button class="navbtn ghost" ${starters>0?'':'disabled'} onclick="simulateStage();">\u23e9 SIMULATE STAGE</button>
    </div>`;
}

function beginStage(){
  buildRace();
  G.race.running = false;      // nothing moves until you say so
  G.race.preRace = true;
  G.screen = 'race';
  render();
  startRaceLoop();
}
function startRaceNow(){
  if(!G.race) return;
  G.race.preRace = false;
  G.race.running = true;
  pushEvent('The riders are away.');
  render();
}

function simulateStage(){
  stopRace();
  buildRace();
  G.screen='race';
  simulateToFinish();   // runs the whole stage, then shows the result
}

initDelegation();
render();
</script>
</body>
</html>
